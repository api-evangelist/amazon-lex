  /bots/{botId}/botversions/{botVersion}/botlocales/{localeId}/intents:
    put:
      operationId: CreateIntent
      summary: Creates an intent.
      description: 'Creates an intent. To define the interaction between the user and your bot, you define
        one or more intents. For example, for a pizza ordering bot you would create an OrderPizza intent.
        When you create an intent, you must provide a name. You can optionally provide the following:
        Sample utterances. For example, "I want to order a pizza" and "Can I order a pizza." You can''t
        provide utterances for built-in intents. Information to be gathered. You specify slots for the
        information that you bot requests from the user. You can specify standard slot types, such as
        date and time, or custom slot types for your application. How the intent is fulfilled. You can
        provide a Lambda function or configure the intent to return the intent information to your client
        application. If you use a Lambda function, Amazon Lex invokes the function when all of the intent
        information is available. A confirmation prompt to send to the user to confirm an intent. For
        example, "Shall I order your pizza?" A conclusion statement to send to the user after the intent
        is fulfilled. For example, "I ordered your pizza." A follow-up prompt that asks the user for additional
        activity. For example, "Do you want a drink with your pizza?"'
      tags:
      - bots
      parameters:
      - name: botId
        in: path
        required: true
        description: The identifier of the bot associated with this intent.
        schema:
          type: string
          minLength: 10
          maxLength: 10
          pattern: ^[0-9a-zA-Z]+$
      - name: botVersion
        in: path
        required: true
        description: The version of the bot associated with this intent.
        schema:
          type: string
          minLength: 5
          maxLength: 5
          pattern: ^DRAFT$
      - name: localeId
        in: path
        required: true
        description: The identifier of the language and locale where this intent is used. All of the bots,
          slot types, and slots used by the intent must have the same locale. For more information, see
          Supported languages.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                intentName:
                  type: string
                  minLength: 1
                  maxLength: 100
                  pattern: ^([0-9a-zA-Z][_-]?){1,100}$
                  description: The name of the intent. Intent names must be unique in the locale that
                    contains the intent and cannot match the name of any built-in intent.
                intentDisplayName:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: A display name for the intent. If configured, This name will be shown to
                    users during Intent Disambiguation instead of the intent name. Display names should
                    be user-friendly, descriptive and match the intent's purpose to improve user experience
                    during disambiguation.
                description:
                  type: string
                  minLength: 0
                  maxLength: 2000
                  description: A description of the intent. Use the description to help identify the intent
                    in lists.
                parentIntentSignature:
                  type: string
                  description: A unique identifier for the built-in intent to base this intent on.
                sampleUtterances:
                  type: array
                  items:
                    $ref: '#/components/schemas/SampleUtterance'
                dialogCodeHook:
                  $ref: '#/components/schemas/DialogCodeHookSettings'
                fulfillmentCodeHook:
                  $ref: '#/components/schemas/FulfillmentCodeHookSettings'
                intentConfirmationSetting:
                  $ref: '#/components/schemas/IntentConfirmationSetting'
                intentClosingSetting:
                  $ref: '#/components/schemas/IntentClosingSetting'
                inputContexts:
                  type: array
                  items:
                    $ref: '#/components/schemas/InputContext'
                outputContexts:
                  type: array
                  items:
                    $ref: '#/components/schemas/OutputContext'
                kendraConfiguration:
                  $ref: '#/components/schemas/KendraConfiguration'
                initialResponseSetting:
                  $ref: '#/components/schemas/InitialResponseSetting'
                qnAIntentConfiguration:
                  $ref: '#/components/schemas/QnAIntentConfiguration'
                qInConnectIntentConfiguration:
                  $ref: '#/components/schemas/QInConnectIntentConfiguration'
              required:
              - intentName
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateIntentResponse'
        '400':
          description: ValidationException
          content:
            application/json:
              schema:
