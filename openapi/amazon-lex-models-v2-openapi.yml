    bots, aliases, locales, intents, slots, slot types, custom vocabularies, imports/exports, test sets
    and analytics. Derived mechanically from the AWS-published Smithy 2.0 service model (aws/api-models-aws,
    models/lex-models-v2/service/2020-08-07). Requests are signed with AWS Signature Version 4 using service
    name lex.
  version: '2020-08-07'
  contact:
    name: AWS Support
    url: https://aws.amazon.com/premiumsupport/
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  x-generated-from: AWS Smithy 2.0 service model (https://github.com/aws/api-models-aws) — mechanical
    transform, no hand-authored operations
servers:
- url: https://models-v2-lex.us-east-1.amazonaws.com
  description: Amazon Lex V2 Model Building endpoint (us-east-1; one regional endpoint per AWS Region
    — see https://docs.aws.amazon.com/general/latest/gr/lex.html)
tags:
- name: bots
- name: builtins
- name: createuploadurl
- name: exports
- name: imports
- name: policy
- name: tags
- name: testexecutions
- name: testsetdiscrepancy
