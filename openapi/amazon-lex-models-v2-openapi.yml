      - eventDate
    BotLocaleImportSpecification:
      type: object
      description: Provides the bot locale parameters required for importing a bot locale.
      properties:
        botId:
          type: string
          minLength: 10
          maxLength: 10
          pattern: ^[0-9a-zA-Z]+$
          description: The identifier of the bot to import the locale to.
        botVersion:
          type: string
          minLength: 5
          maxLength: 5
          pattern: ^DRAFT$
          description: The version of the bot to import the locale to. This can only be the DRAFT version
            of the bot.
        localeId:
          type: string
          description: The identifier of the language and locale that the bot will be used in. The string
            must match one of the supported locales. All of the intents, slot types, and slots used in
            the bot must have the same locale. For more information, see Supported languages.
        nluIntentConfidenceThreshold:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: 'Determines the threshold where Amazon Lex will insert the AMAZON.FallbackIntent,
            AMAZON.KendraSearchIntent, or both when returning alternative intents. AMAZON.FallbackIntent
            and AMAZON.KendraSearchIntent are only inserted if they are configured for the bot. For example,
            suppose a bot is configured with the confidence threshold of 0.80 and the AMAZON.FallbackIntent.
            Amazon Lex returns three alternative intents with the following confidence scores: IntentA
            (0.70), IntentB (0.60), IntentC (0.50). The response from the PostText operation would be:
            AMAZON.FallbackIntent IntentA IntentB IntentC'
        voiceSettings:
          $ref: '#/components/schemas/VoiceSettings'
        speechRecognitionSettings:
          $ref: '#/components/schemas/SpeechRecognitionSettings'
        speechDetectionSensitivity:
          type: string
          enum:
          - Default
          - HighNoiseTolerance
          - MaximumNoiseTolerance
          description: The sensitivity level for voice activity detection (VAD) in the bot locale. This
            setting helps optimize speech recognition accuracy by adjusting how the system responds to
            background noise during voice interactions.
        unifiedSpeechSettings:
          $ref: '#/components/schemas/UnifiedSpeechSettings'
        audioFillerSettings:
          $ref: '#/components/schemas/AudioFillerSettings'
      required:
      - botId
      - botVersion
      - localeId
    BotLocaleSortBy:
      type: object
      description: Specifies attributes for sorting a list of bot locales.
      properties:
        attribute:
          type: string
          enum:
          - BotLocaleName
          description: The bot locale attribute to sort by.
        order:
          type: string
          enum:
          - Ascending
          - Descending
          description: Specifies whether to sort the bot locales in ascending or descending order.
      required:
