        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                localeId:
                  type: string
                  description: The identifier of the language and locale that the bot will be used in.
                    The string must match one of the supported locales. All of the intents, slot types,
                    and slots used in the bot must have the same locale. For more information, see Supported
                    languages.
                description:
                  type: string
                  minLength: 0
                  maxLength: 2000
                  description: A description of the bot locale. Use this to help identify the bot locale
                    in lists.
                nluIntentConfidenceThreshold:
                  type: number
                  format: double
                  minimum: 0
                  maximum: 1
                  description: 'Determines the threshold where Amazon Lex will insert the AMAZON.FallbackIntent,
                    AMAZON.KendraSearchIntent, or both when returning alternative intents. AMAZON.FallbackIntent
                    and AMAZON.KendraSearchIntent are only inserted if they are configured for the bot.
                    For example, suppose a bot is configured with the confidence threshold of 0.80 and
                    the AMAZON.FallbackIntent. Amazon Lex returns three alternative intents with the following
                    confidence scores: IntentA (0.70), IntentB (0.60), IntentC (0.50). The response from
                    the RecognizeText operation would be: AMAZON.FallbackIntent IntentA IntentB IntentC'
                voiceSettings:
                  $ref: '#/components/schemas/VoiceSettings'
