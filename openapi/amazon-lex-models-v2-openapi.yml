      properties:
        botId:
          type: string
          minLength: 10
          maxLength: 10
          pattern: ^[0-9a-zA-Z]+$
          description: The identifier of the bot assigned by Amazon Lex.
        botVersion:
          type: string
          minLength: 1
          maxLength: 5
          pattern: ^(DRAFT|[0-9]+)$
          description: The version of the bot that was exported. This will be either DRAFT or the version
            number.
      required:
      - botId
      - botVersion
    BotFilter:
      type: object
      description: Filters the responses returned by the ListBots operation.
      properties:
        name:
          type: string
          enum:
          - BotName
          - BotType
          description: The name of the field to filter the list of bots.
        values:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 100
            pattern: ^[0-9a-zA-Z_()\s-]+$
        operator:
          type: string
          enum:
          - CO
          - EQ
          - NE
          description: The operator to use for the filter. Specify EQ when the ListBots operation should
            return only aliases that equal the specified value. Specify CO when the ListBots operation
            should return aliases that contain the specified value.
      required:
      - name
      - values
      - operator
    BotImportSpecification:
      type: object
      description: Provides the bot parameters required for importing a bot.
      properties:
        botName:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^([0-9a-zA-Z][_-]?){1,100}$
          description: The name that Amazon Lex should use for the bot.
        roleArn:
          type: string
          minLength: 32
          maxLength: 2048
          pattern: ^arn:aws:iam::[0-9]{12}:role/.*$
          description: The Amazon Resource Name (ARN) of the IAM role used to build and run the bot.
        dataPrivacy:
          $ref: '#/components/schemas/DataPrivacy'
        errorLogSettings:
          $ref: '#/components/schemas/ErrorLogSettings'
        idleSessionTTLInSeconds:
          type: integer
          minimum: 60
          maximum: 86400
          description: The time, in seconds, that Amazon Lex should keep information about a user's conversation
            with the bot. A user interaction remains active for the amount of time specified. If no conversation
            occurs during this time, the session expires and Amazon Lex deletes any data provided before
            the timeout. You can specify between 60 (1 minute) and 86,400 (24 hours) seconds.
        botTags:
          type: object
          additionalProperties:
            type: string
            minLength: 0
            maxLength: 256
        testBotAliasTags:
          type: object
          additionalProperties:
            type: string
            minLength: 0
            maxLength: 256
      required:
      - botName
      - roleArn
      - dataPrivacy
    BotLocaleExportSpecification:
      type: object
