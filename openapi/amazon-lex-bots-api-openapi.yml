            $ref: '#/components/schemas/AnalyticsIntentGroupByKey'
        metricsResults:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsIntentMetricResult'
    AnalyticsUtteranceMetric:
      type: object
      description: Contains the metric and the summary statistic you want to calculate, and the order in which to sort the results, for the utterances across the user sessions with the bot.
      properties:
        name:
          type: string
          enum:
          - Count
          - Missed
          - Detected
          - UtteranceTimestamp
          description: The metric for which you want to get utterance summary statistics. Count – The number of utterances. Missed – The number of utterances that Amazon Lex failed to recognize. Detected – The number of utterances that Amazon Lex managed to detect. UtteranceTimestamp – The date and time of the utterance.
        statistic:
          type: string
          enum:
          - Sum
          - Avg
          - Max
          description: The summary statistic to calculate. Sum – The total count for the category you provide in name. Average – The total count divided by the number of utterances in the category you provide in name. Max – The highest count in the category you provide in name.
        order:
          type: string
          enum:
          - Ascending
          - Descending
          description: Specifies whether to sort the results in ascending or descending order.
      required:
      - name
      - statistic
    ValidationException:
      type: object
      description: One of the input parameters in your request isn't valid. Check the parameters and try your request again.
      properties:
        message:
          type: string
    IntentOverride:
      type: object
      description: Override settings to configure the intent state.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^([0-9a-zA-Z][_-]?){1,100}$
          description: The name of the intent. Only required when you're switching intents.
        slots:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SlotValueOverride'
    BotAliasLocaleSettings:
      type: object
      description: Specifies settings that are unique to a locale. For example, you can use different Lambda function depending on the bot's locale.
      properties:
        enabled:
          type: boolean
          description: Determines whether the locale is enabled for the bot. If the value is false, the locale isn't available for use.
        codeHookSpecification:
          $ref: '#/components/schemas/CodeHookSpecification'
      required:
      - enabled
    ExternalSourceSetting:
      type: object
      description: Provides information about the external source of the slot type's definition.
      properties:
        grammarSlotTypeSetting:
          $ref: '#/components/schemas/GrammarSlotTypeSetting'
    RuntimeHints:
      type: object
      description: You can provide Amazon Lex V2 with hints to the phrases that a customer is likely to use for a slot. When a slot with hints is resolved, the phrases in the runtime hints are preferred in the resolution. You can provide hints for a maximum of 100 intents. You can provide a maximum of 100 slots. Before you can use runtime hints with an existing bot, you must first rebuild the bot. For more information, see Using runtime hints to improve recognition of slot values.
      properties:
        slotHints:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              $ref: '#/components/schemas/RuntimeHintDetails'
    Value:
      type: object
      description: Information about the value provided for a slot and Amazon Lex V2's interpretation.
      properties:
        originalValue:
          type: string
          minLength: 1
          description: The part of the user's response to the slot elicitation that Amazon Lex V2 determines is relevant to the slot value.
        interpretedValue:
          type: string
          minLength: 1
          description: The value that Amazon Lex V2 determines for the slot, given the user input. The actual value depends on the setting of the value selection strategy for the bot. You can choose to use the value entered by the user, or you can have Amazon Lex V2 choose the first value in the resolvedValues list.
        resolvedValues:
          type: array
          items:
            type: string
            minLength: 1
      required:
      - interpretedValue
    StartConversationResponse:
      type: object
      properties:
        responseEventStream:
          $ref: '#/components/schemas/StartConversationResponseEventStream'
    PlaybackInterruptionEvent:
      type: object
      description: Event sent from Amazon Lex V2 to indicate to the client application should stop playback of audio. For example, if the client is playing a prompt that asks for the user's telephone number, the user might start to say the phone number before the prompt is complete. Amazon Lex V2 sends this event to the client application to indicate that the user is responding and that Amazon Lex V2 is processing their input.
      properties:
        eventReason:
          type: string
          enum:
          - DTMF_START_DETECTED
          - TEXT_DETECTED
          - VOICE_START_DETECTED
          description: Indicates the type of user input that Amazon Lex V2 detected.
        causedByEventId:
          type: string
          minLength: 2
          maxLength: 100
          pattern: ^[0-9a-zA-Z._:-]+$
          description: The identifier of the event that contained the audio, DTMF, or text that caused the interruption.
        eventId:
          type: string
          minLength: 2
          maxLength: 100
          pattern: ^[0-9a-zA-Z._:-]+$
          description: A unique identifier of the event sent by Amazon Lex V2. The identifier is in the form RESPONSE-N, where N is a number starting with one and incremented for each event sent by Amazon Lex V2 in the current session.
    DependencyFailedException:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    SentimentScore:
      type: object
      description: The individual sentiment responses for the utterance.
      properties:
        positive:
          type: number
          format: double
          description: The level of confidence that Amazon Comprehend has in the accuracy of its detection of the POSITIVE sentiment.
        negative:
          type: number
          format: double
          description: The level of confidence that Amazon Comprehend has in the accuracy of its detection of the NEGATIVE sentiment.
        neutral:
          type: number
          format: double
          description: The level of confidence that Amazon Comprehend has in the accuracy of its detection of the NEUTRAL sentiment.
        mixed:
          type: number
          format: double
          description: The level of confidence that Amazon Comprehend has in the accuracy of its detection of the MIXED sentiment.
    PlaybackCompletionEvent:
      type: object
      description: Event sent from the client application to Amazon Lex V2 to indicate that playback of audio is complete and that Amazon Lex V2 should start processing the user's input.
      properties:
        eventId:
          type: string
          minLength: 2
          maxLength: 100
          pattern: ^[0-9a-zA-Z._:-]+$
          description: A unique identifier that your application assigns to the event. You can use this to identify events in logs.
        clientTimestampMillis:
          type: integer
          format: int64
          description: A timestamp set by the client of the date and time that the event was sent to Amazon Lex V2.
    ValidationException_2:
      type: object
      properties:
        message:
          type: string
