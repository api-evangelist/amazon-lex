- aid: amazon-lex:amazon-lex-runtime-v2-api
  name: Amazon Lex Runtime V2 API
  description: >-
    Send user input to a built Amazon Lex V2 bot and manage the conversation session. Six operations:
    RecognizeText (text turn), RecognizeUtterance (audio or text turn), StartConversation (bidirectional
    HTTP/2 streaming with barge-in), and PutSession / GetSession / DeleteSession for session state.
  baseURL: https://runtime-v2-lex.us-east-1.amazonaws.com
