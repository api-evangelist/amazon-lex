note: >-
  The Amazon Lex V2 entity graph is legible straight from the URI templates — the REST paths nest
  exactly as the resources do, so the containment hierarchy below is read off the contract rather than
  inferred from schema names. One fact dominates the model and catches most integrators: EVERY
  build-time resource below the bot is addressed by a four-part key (botId, botVersion, localeId, then
  its own id). An intent id alone is not addressable; `DRAFT` is the version you use while developing
  and a numbered version once you have snapshotted.
identifier_convention:
  style: opaque 10-character resource id
  evidence: >-
    'The Amazon Lex V2 API assigns every resource a unique 10-character resource ID.' —
    https://docs.aws.amazon.com/lexv2/latest/dg/migration.html
  note: >-
    Ids carry no type prefix. A botId and an intentId are indistinguishable by shape, so a caller cannot
    tell from the value alone which resource it addresses — position in the path is the only type signal.
  exceptions:
  - localeId is a language tag (en_US, fr_FR), not a generated id.
  - botVersion is a numeric string or the literal DRAFT.
  - replicaRegion is an AWS region name.
  - TSTALIASID is a reserved, well-known botAliasId for the built-in test alias.
