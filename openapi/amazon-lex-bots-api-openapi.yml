      properties:
        name:
          type: string
          enum:
          - Count
          - Success
          - Failure
          - Dropped
          - Duration
          - TurnsPerConversation
          - Concurrency
          description: The metric for which you want to get session summary statistics. Count – The number of sessions. Success – The number of sessions that succeeded. Failure – The number of sessions that failed. Dropped – The number of sessions that the user dropped. Duration – The duration of sessions. TurnsPerSession – The number of turns in the sessions. Concurrency – The number of sessions occurring in the same period of time.
        statistic:
          type: string
          enum:
          - Sum
          - Avg
