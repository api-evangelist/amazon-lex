  /bots/{botId}:
    delete:
      operationId: DeleteBot
      summary: Deletes all versions of a bot, including the Draft version.
      description: Deletes all versions of a bot, including the Draft version. To delete a specific version,
        use the DeleteBotVersion operation. When you delete a bot, all of the resources contained in the
        bot are also deleted. Deleting a bot removes all locales, intents, slot, and slot types defined
        for the bot. If a bot has an alias, the DeleteBot operation returns a ResourceInUseException exception.
        If you want to delete the bot and the alias, set the skipResourceInUseCheck parameter to true.
      tags:
      - bots
      parameters:
      - name: botId
        in: path
        required: true
        description: The identifier of the bot to delete.
        schema:
          type: string
          minLength: 10
          maxLength: 10
          pattern: ^[0-9a-zA-Z]+$
      - name: skipResourceInUseCheck
        in: query
        required: false
        description: By default, Amazon Lex checks if any other resource, such as an alias or bot network,
          is using the bot version before it is deleted and throws a ResourceInUseException exception
          if the bot is being used by another resource. Set this parameter to true to skip this check
          and remove the bot even if it is being used by another resource.
        schema:
          type: boolean
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteBotResponse'
        '400':
          description: ValidationException
          content:
