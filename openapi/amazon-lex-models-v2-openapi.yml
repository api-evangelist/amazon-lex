      properties:
        captureResponse:
          $ref: '#/components/schemas/ResponseSpecification'
        captureNextStep:
          $ref: '#/components/schemas/DialogState'
        captureConditional:
          $ref: '#/components/schemas/ConditionalSpecification'
        failureResponse:
          $ref: '#/components/schemas/ResponseSpecification'
        failureNextStep:
          $ref: '#/components/schemas/DialogState'
        failureConditional:
          $ref: '#/components/schemas/ConditionalSpecification'
        codeHook:
          $ref: '#/components/schemas/DialogCodeHookInvocationSetting'
        elicitationCodeHook:
          $ref: '#/components/schemas/ElicitationCodeHookInvocationSetting'
    SlotDefaultValue:
      type: object
      description: Specifies the default value to use when a user doesn't provide a value for a slot.
      properties:
        defaultValue:
          type: string
          minLength: 1
          maxLength: 202
          description: The default value to use when a user doesn't provide a value for a slot.
      required:
      - defaultValue
    SlotDefaultValueSpecification:
      type: object
      description: Defines a list of values that Amazon Lex should use as the default value for a slot.
      properties:
        defaultValueList:
          type: array
          items:
            $ref: '#/components/schemas/SlotDefaultValue'
      required:
      - defaultValueList
    SlotFilter:
      type: object
      description: Filters the response from the ListSlots operation.
      properties:
        name:
          type: string
          enum:
          - SlotName
          description: The name of the field to use for filtering.
        values:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 100
            pattern: ^[0-9a-zA-Z_()\s-]+$
        operator:
          type: string
          enum:
          - CO
          - EQ
          description: The operator to use for the filter. Specify EQ when the ListSlots operation should
            return only aliases that equal the specified value. Specify CO when the ListSlots operation
            should return aliases that contain the specified value.
