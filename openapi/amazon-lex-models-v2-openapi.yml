        botRecommendationId:
          type: string
          minLength: 10
          maxLength: 10
          pattern: ^[0-9a-zA-Z]+$
          description: The identifier of the bot recommendation that you have created.
        creationDateTime:
          type: string
          format: date-time
          description: A timestamp of the date and time that the bot recommendation was created.
        transcriptSourceSetting:
