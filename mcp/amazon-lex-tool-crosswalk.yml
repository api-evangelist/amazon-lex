provider: Amazon Lex
providerId: amazon-lex
note: 'Amazon Lex has no MCP tool of its own, so this crosswalk records a shape the catalog should be
  able to distinguish: EVERY one of the 113 published operations is rest_only, and the single binding
  that reaches them is a generic AWS script executor. An agent cannot discover a Lex operation from the
  MCP surface — it has to already know the boto3 client name and the operation name, then hand them to
  aws___run_script. That is a real, working path and a materially weaker one than a named tool carrying
  the operation''s inputSchema.'
