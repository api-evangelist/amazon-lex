        schema:
          type: string
          minLength: 10
          maxLength: 10
          pattern: ^[0-9a-zA-Z]+$
      - name: botVersion
        in: path
        required: true
        description: The version of the bot associated with the slot.
        schema:
          type: string
          minLength: 5
          maxLength: 5
          pattern: ^DRAFT$
      - name: localeId
        in: path
        required: true
        description: The identifier of the language and locale that the slot will be used in. The string
          must match one of the supported locales. All of the bots, intents, slot types used by the slot
          must have the same locale. For more information, see Supported languages.
        schema:
          type: string
      - name: intentId
        in: path
        required: true
        description: The identifier of the intent that contains the slot.
        schema:
          type: string
          minLength: 10
          maxLength: 10
          pattern: ^[0-9a-zA-Z]+$
      requestBody:
