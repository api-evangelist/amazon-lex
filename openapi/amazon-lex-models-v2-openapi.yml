      description: Creates a slot in an intent. A slot is a variable needed to fulfill an intent. For
        example, an OrderPizza intent might need slots for size, crust, and number of pizzas. For each
        slot, you define one or more utterances that Amazon Lex uses to elicit a response from the user.
      tags:
