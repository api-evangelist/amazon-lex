note: >-
  Amazon Lex ships no standalone SDK. Every first-party client is a per-service module inside the AWS SDK
  for that language, released on the AWS SDK's own daily cadence — which is why every version below was
  published within days of this probe. Two modules exist per language: the Model Building V2 client
  (build and manage bots) and the Runtime V2 client (talk to a built bot). The aggregate SDKs (boto3,
  aws-sdk-php, aws-sdk-java v1) carry Lex inside a single package rather than a per-service artifact.
