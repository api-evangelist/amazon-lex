  /bots/{botId}/aggregatedutterances:
    post:
      operationId: ListAggregatedUtterances
      summary: Provides a list of utterances that users have sent to the bot.
      description: 'Provides a list of utterances that users have sent to the bot. Utterances are aggregated
        by the text of the utterance. For example, all instances where customers used the phrase "I want
        to order pizza" are aggregated into the same line in the response. You can see both detected utterances
        and missed utterances. A detected utterance is where the bot properly recognized the utterance
        and activated the associated intent. A missed utterance was not recognized by the bot and didn''t
        activate an intent. Utterances can be aggregated for a bot alias or for a bot version, but not
        both at the same time. Utterances statistics are not generated under the following conditions:
        The childDirected field was set to true when the bot was created. You are using slot obfuscation
        with one or more slots. You opted out of participating in improving Amazon Lex.'
      tags:
      - bots
      parameters:
      - name: botId
        in: path
        required: true
        description: The unique identifier of the bot associated with this request.
        schema:
          type: string
          minLength: 10
          maxLength: 10
          pattern: ^[0-9a-zA-Z]+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                botAliasId:
                  type: string
                  minLength: 10
                  maxLength: 10
                  pattern: ^(\bTSTALIASID\b|[0-9a-zA-Z]+)$
                  description: The identifier of the bot alias associated with this request. If you specify
                    the bot alias, you can't specify the bot version.
                botVersion:
                  type: string
                  minLength: 1
                  maxLength: 5
                  pattern: ^(DRAFT|[0-9]+)$
                  description: The identifier of the bot version associated with this request. If you
                    specify the bot version, you can't specify the bot alias.
                localeId:
                  type: string
                  description: The identifier of the language and locale where the utterances were collected.
                    For more information, see Supported languages.
                aggregationDuration:
                  $ref: '#/components/schemas/UtteranceAggregationDuration'
                sortBy:
                  $ref: '#/components/schemas/AggregatedUtterancesSortBy'
                filters:
                  type: array
                  items:
                    $ref: '#/components/schemas/AggregatedUtterancesFilter'
                maxResults:
                  type: integer
                  minimum: 1
                  maximum: 1000
                  description: The maximum number of utterances to return in each page of results. If
                    there are fewer results than the maximum page size, only the actual number of results
                    are returned. If you don't specify the maxResults parameter, 1,000 results are returned.
                nextToken:
                  type: string
                  description: If the response from the ListAggregatedUtterances operation contains more
                    results that specified in the maxResults parameter, a token is returned in the response.
                    Use that token in the nextToken parameter to return the next page of results.
              required:
              - localeId
              - aggregationDuration
      responses:
        '200':
