    AnalyticsIntentStageMetricResult:
      type: object
      description: An object containing the results for an intent stage metric you requested.
      properties:
        name:
          type: string
          enum:
          - Count
          - Success
          - Failed
          - Dropped
          - Retry
          description: The metric that you requested. Count – The number of times the intent stage occurred. Success – The number of times the intent stage succeeded. Failure – The number of times the intent stage failed. Dropped – The number of times the user dropped the intent stage. Retry – The number of times the bot tried to elicit a response from the user at this stage.
        statistic:
          type: string
          enum:
          - Sum
          - Avg
          - Max
          description: The summary statistic that you requested to calculate. Sum – The total count for the category you provide in name. Average – The total count divided by the number of intent stages in the category you provide in name. Max – The highest count in the category you provide in name.
        value:
          type: number
          format: double
          description: The value of the summary statistic for the metric that you requested.
