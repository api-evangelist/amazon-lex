    AssociatedTranscript:
      type: object
      description: The object containing information that associates the recommended intent/slot type
        with a conversation.
      properties:
        transcript:
          type: string
          minLength: 1
          maxLength: 6000000
          pattern: .*
          description: The content of the transcript that meets the search filter criteria. For the JSON
            format of the transcript, see Output transcript format.
    AssociatedTranscriptFilter:
      type: object
      description: Filters to search for the associated transcript.
      properties:
        name:
          type: string
          enum:
          - IntentId
          - SlotTypeId
          description: The name of the field to use for filtering. The allowed names are IntentId and
            SlotTypeId.
        values:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 100
            pattern: ^[0-9a-zA-Z_()\s-]+$
      required:
      - name
      - values
    AudioAndDTMFInputSpecification:
      type: object
      description: Specifies the audio and DTMF input specification.
      properties:
        startTimeoutMs:
          type: integer
          minimum: 1
          description: Time for which a bot waits before assuming that the customer isn't going to speak
            or press a key. This timeout is shared between Audio and DTMF inputs.
        audioSpecification:
          $ref: '#/components/schemas/AudioSpecification'
        dtmfSpecification:
          $ref: '#/components/schemas/DTMFSpecification'
      required:
      - startTimeoutMs
    AudioFillerSettings:
      type: object
      description: Configuration that plays background filler audio during speech-to-speech interactions
        to mask processing delays and improve the perceived responsiveness of the bot. Audio filler requires
        unifiedSpeechSettings (speech-to-speech) to be enabled on the bot locale when enabled is true.
      properties:
        enabled:
          type: boolean
          description: Specifies whether audio filler playback is enabled for the bot locale. Set to true
            to play filler audio while Amazon Lex processes a user utterance. Set to false to disable
            filler audio.
        audioType:
          type: string
          enum:
          - MELODY_CHIPPER_CHIME
          - MELODY_CURIOUS_CRAWL
          - MELODY_RISING_RIPPLE
          - MELODY_PATIENT_PING
          - MELODY_PONDERING_PONG
          - TYPING_KINETIC_KEYS
          - TYPING_QUIET_QWERTY
          description: The identifier of the audio filler to play while Amazon Lex processes the user's
            input. This field is required when enabled is true.
        startDelayInMilliseconds:
          type: integer
          description: The time, in milliseconds, to wait after the end of the user's utterance before
            starting audio filler playback. Valid range is 500 to 5000 milliseconds. If not specified,
            Amazon Lex uses a default of 2500 milliseconds.
        minimumPlayDurationInMilliseconds:
          type: integer
          description: The minimum time, in milliseconds, that audio filler plays once it has started,
            even if the bot response becomes ready sooner. Valid range is 1000 to 5000 milliseconds. If
            not specified, Amazon Lex uses a default of 3000 milliseconds.
        responseDeliveryDelayInMilliseconds:
          type: integer
          description: The silent delay, in milliseconds, inserted between the end of audio filler playback
            and the start of the bot's response. Valid range is 200 to 1000 milliseconds. If not specified,
            Amazon Lex uses a default of 500 milliseconds.
    AudioLogDestination:
      type: object
      description: The location of audio log files collected when conversation logging is enabled for
        a bot.
      properties:
        s3Bucket:
          $ref: '#/components/schemas/S3BucketLogDestination'
      required:
      - s3Bucket
    AudioLogSetting:
      type: object
      description: Settings for logging audio of conversations between Amazon Lex and a user. You specify
        whether to log audio and the Amazon S3 bucket where the audio file is stored.
      properties:
        enabled:
          type: boolean
          description: Determines whether audio logging in enabled for the bot.
        destination:
          $ref: '#/components/schemas/AudioLogDestination'
        selectiveLoggingEnabled:
          type: boolean
          description: The option to enable selective conversation log capture for audio.
      required:
      - enabled
      - destination
    AudioSpecification:
      type: object
      description: Specifies the audio input specifications.
      properties:
        maxLengthMs:
          type: integer
          minimum: 1
          description: Time for how long Amazon Lex waits before speech input is truncated and the speech
            is returned to application.
        endTimeoutMs:
          type: integer
          minimum: 1
          description: Time for which a bot waits after the customer stops speaking to assume the utterance
            is finished.
      required:
      - maxLengthMs
      - endTimeoutMs
