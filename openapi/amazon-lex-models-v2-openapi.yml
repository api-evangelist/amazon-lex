  /bots/{botId}/analytics/intentmetrics:
    post:
      operationId: ListIntentMetrics
      summary: Retrieves summary metrics for the intents in your bot.
      description: 'Retrieves summary metrics for the intents in your bot. The following fields are required:
        metrics – A list of AnalyticsIntentMetric objects. In each object, use the name field to specify
        the metric to calculate, the statistic field to specify whether to calculate the Sum, Average,
        or Max number, and the order field to specify whether to sort the results in Ascending or Descending
        order. startDateTime and endDateTime – Define a time range for which you want to retrieve results.
        Of the optional fields, you can organize the results in the following ways: Use the filters field
        to filter the results, the groupBy field to specify categories by which to group the results,
        and the binBy field to specify time intervals by which to group the results. Use the maxResults
        field to limit the number of results to return in a single response and the nextToken field to
        return the next batch of results if the response does not return the full set of results. Note
        that an order field exists in both binBy and metrics. You can specify only one order in a given
        request.'
      tags:
      - bots
      parameters:
      - name: botId
        in: path
        required: true
        description: The identifier for the bot for which you want to retrieve intent metrics.
        schema:
          type: string
          minLength: 10
          maxLength: 10
          pattern: ^[0-9a-zA-Z]+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                startDateTime:
                  type: string
                  format: date-time
                  description: The timestamp that marks the beginning of the range of time for which you
                    want to see intent metrics.
                endDateTime:
                  type: string
                  format: date-time
                  description: The date and time that marks the end of the range of time for which you
                    want to see intent metrics.
                metrics:
                  type: array
                  items:
