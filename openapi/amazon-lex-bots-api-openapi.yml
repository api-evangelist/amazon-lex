        creationDateTime:
          type: string
          format: date-time
          description: A timestamp of the date and time that the bot was created.
        lastUpdatedDateTime:
          type: string
          format: date-time
          description: A timestamp of the date and time that the bot was last updated.
        botType:
          type: string
