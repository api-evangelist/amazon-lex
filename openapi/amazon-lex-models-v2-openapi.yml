components:
  securitySchemes:
    sigv4:
      type: apiKey
      name: Authorization
      in: header
      x-amazon-apigateway-authtype: awsSigv4
      description: AWS Signature Version 4. Sign requests with SigV4 using service name `lex` and the
        calling region.
  schemas:
    ActiveContext:
      type: object
      description: The active context used in the test execution.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^([A-Za-z]_?)+$
          description: The name of active context.
      required:
      - name
    AdvancedRecognitionSetting:
      type: object
      description: Provides settings that enable advanced recognition settings for slot values.
      properties:
        audioRecognitionStrategy:
          type: string
          enum:
          - UseSlotValuesAsCustomVocabulary
          description: Enables using the slot values as a custom vocabulary for recognizing user utterances.
    AgentTurnResult:
      type: object
      description: The information about the agent turn in a test set execution.
      properties:
        expectedAgentPrompt:
          type: string
          minLength: 1
          maxLength: 1024
          description: The expected agent prompt for the agent turn in a test set execution.
        actualAgentPrompt:
          type: string
          minLength: 1
          maxLength: 1024
          description: The actual agent prompt for the agent turn in a test set execution.
        errorDetails:
          $ref: '#/components/schemas/ExecutionErrorDetails'
        actualElicitedSlot:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^([0-9a-zA-Z][_.-]?)+$
          description: The actual elicited slot for the agent turn in a test set execution.
        actualIntent:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^([0-9a-zA-Z][_-]?){1,100}$
          description: The actual intent for the agent turn in a test set execution.
      required:
      - expectedAgentPrompt
    AgentTurnSpecification:
      type: object
      description: The specification of an agent turn.
      properties:
        agentPrompt:
          type: string
          minLength: 1
          maxLength: 1024
          description: The agent prompt for the agent turn in a test set.
      required:
      - agentPrompt
    AggregatedUtterancesFilter:
      type: object
      description: Filters responses returned by the ListAggregatedUtterances operation.
      properties:
        name:
          type: string
          enum:
          - Utterance
          description: The name of the field to filter the utterance list.
        values:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 100
            pattern: ^[0-9a-zA-Z_()\s-]+$
        operator:
          type: string
          enum:
          - CO
          - EQ
          description: The operator to use for the filter. Specify EQ when the ListAggregatedUtterances
            operation should return only utterances that equal the specified value. Specify CO when the
            ListAggregatedUtterances operation should return utterances that contain the specified value.
      required:
      - name
      - values
      - operator
    AggregatedUtterancesSortBy:
      type: object
      description: Specifies attributes for sorting a list of utterances.
      properties:
        attribute:
          type: string
          enum:
          - HitCount
          - MissedCount
          description: The utterance attribute to sort by.
        order:
          type: string
          enum:
          - Ascending
          - Descending
          description: Specifies whether to sort the aggregated utterances in ascending or descending
            order.
      required:
      - attribute
      - order
    AggregatedUtterancesSummary:
      type: object
      description: Provides summary information for aggregated utterances. The ListAggregatedUtterances
        operations combines all instances of the same utterance into a single aggregated summary.
      properties:
        utterance:
          type: string
          description: The text of the utterance. If the utterance was used with the RecognizeUtterance
            operation, the text is the transcription of the audio utterance.
        hitCount:
          type: integer
          description: The number of times that the utterance was detected by Amazon Lex during the time
            period. When an utterance is detected, it activates an intent or a slot.
        missedCount:
          type: integer
          description: The number of times that the utterance was missed by Amazon Lex An utterance is
            missed when it doesn't activate an intent or slot.
        utteranceFirstRecordedInAggregationDuration:
          type: string
          format: date-time
          description: The date and time that the utterance was first recorded in the time window for
            aggregation. An utterance may have been sent to Amazon Lex before that time, but only utterances
            within the time window are counted.
        utteranceLastRecordedInAggregationDuration:
          type: string
          format: date-time
          description: The last date and time that an utterance was recorded in the time window for aggregation.
            An utterance may be sent to Amazon Lex after that time, but only utterances within the time
            window are counted.
        containsDataFromDeletedResources:
          type: boolean
          description: Aggregated utterance data may contain utterances from versions of your bot that
            have since been deleted. When the aggregated contains this kind of data, this field is set
            to true.
    AllowedInputTypes:
      type: object
      description: Specifies the allowed input types.
      properties:
        allowAudioInput:
          type: boolean
          description: Indicates whether audio input is allowed.
        allowDTMFInput:
          type: boolean
          description: Indicates whether DTMF input is allowed.
      required:
      - allowAudioInput
      - allowDTMFInput
    AnalyticsBinBySpecification:
      type: object
      description: Contains the time metric, interval, and method by which to bin the analytics data.
      properties:
        name:
          type: string
          enum:
          - ConversationStartTime
          - UtteranceTimestamp
          description: Specifies the time metric by which to bin the analytics data.
        interval:
          type: string
          enum:
          - OneHour
          - OneDay
          description: Specifies the interval of time by which to bin the analytics data.
        order:
          type: string
          enum:
          - Ascending
          - Descending
          description: Specifies whether to bin the analytics data in ascending or descending order. If
            this field is left blank, the default order is by the key of the bin in descending order.
      required:
      - name
      - interval
    AnalyticsBinKey:
      type: object
      description: An object containing the criterion by which to bin the results and the value that defines
        that bin.
      properties:
        name:
          type: string
          enum:
          - ConversationStartTime
          - UtteranceTimestamp
          description: The criterion by which to bin the results.
        value:
          type: integer
          format: int64
          description: The value of the criterion that defines the bin.
    AnalyticsIntentFilter:
      type: object
      description: 'Contains fields describing a condition by which to filter the intents. The expression
        may be understood as name operator values. For example: IntentName CO Book – The intent name contains
        the string "Book." BotVersion EQ 2 – The bot version is equal to two. The operators that each
        filter supports are listed below: BotAlias – EQ. BotVersion – EQ. LocaleId – EQ. Modality – EQ.
        Channel – EQ. SessionId – EQ. OriginatingRequestId – EQ. IntentName – EQ, CO. IntentEndState –
        EQ, CO.'
      properties:
        name:
          type: string
          enum:
          - BotAliasId
          - BotVersion
          - LocaleId
          - Modality
          - Channel
          - SessionId
          - OriginatingRequestId
          - IntentName
          - IntentEndState
          description: 'The category by which to filter the intents. The descriptions for each option
            are as follows: BotAlias – The name of the bot alias. BotVersion – The version of the bot.
            LocaleId – The locale of the bot. Modality – The modality of the session with the bot (audio,
            DTMF, or text). Channel – The channel that the bot is integrated with. SessionId – The identifier
            of the session with the bot. OriginatingRequestId – The identifier of the first request in
            a session. IntentName – The name of the intent. IntentEndState – The final state of the intent.'
        operator:
          type: string
          enum:
          - EQ
          - GT
          - LT
          description: 'The operation by which to filter the category. The following operations are possible:
            CO – Contains EQ – Equals GT – Greater than LT – Less than The operators that each filter
            supports are listed below: BotAlias – EQ. BotVersion – EQ. LocaleId – EQ. Modality – EQ. Channel
            – EQ. SessionId – EQ. OriginatingRequestId – EQ. IntentName – EQ, CO. IntentEndState – EQ,
            CO.'
        values:
          type: array
          items:
            type: string
      required:
      - name
      - operator
      - values
    AnalyticsIntentGroupByKey:
      type: object
      description: Contains the category by which the intent analytics were grouped and a member of that
        category.
      properties:
        name:
          type: string
          enum:
          - IntentName
          - IntentEndState
          - IntentLevel
          description: A category by which the intent analytics were grouped.
        value:
          type: string
          description: A member of the category by which the intent analytics were grouped.
    AnalyticsIntentGroupBySpecification:
      type: object
      description: Contains the category by which to group the intents.
      properties:
        name:
          type: string
          enum:
          - IntentName
          - IntentEndState
          - IntentLevel
          description: Specifies whether to group the intent stages by their name or their end state.
      required:
      - name
    AnalyticsIntentMetric:
      type: object
      description: Contains the metric and the summary statistic you want to calculate, and the order
        in which to sort the results, for the intents in the bot.
      properties:
        name:
          type: string
          enum:
          - Count
          - Success
          - Failure
          - Switched
          - Dropped
          description: The metric for which you want to get intent summary statistics. Count – The number
            of times the intent was invoked. Success – The number of times the intent succeeded. Failure
            – The number of times the intent failed. Switched – The number of times there was a switch
            to a different intent. Dropped – The number of times the user dropped the intent.
        statistic:
          type: string
          enum:
          - Sum
          - Avg
          - Max
          description: The summary statistic to calculate. Sum – The total count for the category you
            provide in name. Average – The total count divided by the number of intents in the category
            you provide in name. Max – The highest count in the category you provide in name.
        order:
          type: string
          enum:
          - Ascending
          - Descending
          description: Specifies whether to sort the results in ascending or descending order.
      required:
      - name
      - statistic
    AnalyticsIntentMetricResult:
      type: object
      description: An object containing the results for the intent metric you requested.
      properties:
        name:
          type: string
          enum:
          - Count
          - Success
          - Failure
          - Switched
          - Dropped
          description: The metric that you requested. See Key definitions for more details about these
            metrics. Count – The number of times the intent was invoked. Success – The number of times
            the intent succeeded. Failure – The number of times the intent failed. Switched – The number
            of times there was a switch to a different intent. Dropped – The number of times the user
            dropped the intent.
        statistic:
          type: string
          enum:
          - Sum
          - Avg
          - Max
          description: The statistic that you requested to calculate. Sum – The total count for the category
