          type: string
          minLength: 1
          maxLength: 25
          pattern: ^((AMAZON\.)[a-zA-Z_]+?|[0-9a-zA-Z]+)$
          description: The updated identifier of the slot type that provides values for the slot.
        valueElicitationSetting:
          $ref: '#/components/schemas/SlotValueElicitationSetting'
        obfuscationSetting:
          $ref: '#/components/schemas/ObfuscationSetting'
        botId:
          type: string
          minLength: 10
          maxLength: 10
          pattern: ^[0-9a-zA-Z]+$
          description: The identifier of the bot that contains the slot.
        botVersion:
          type: string
          minLength: 5
          maxLength: 5
          pattern: ^DRAFT$
          description: The version of the bot that contains the slot. Will always be DRAFT.
        localeId:
          type: string
          description: The locale that contains the slot.
        intentId:
          type: string
          minLength: 10
          maxLength: 10
          pattern: ^[0-9a-zA-Z]+$
          description: The intent that contains the slot.
        creationDateTime:
          type: string
          format: date-time
          description: The timestamp of the date and time that the slot was created.
        lastUpdatedDateTime:
          type: string
          format: date-time
          description: The timestamp of the date and time that the slot was last updated.
        multipleValuesSetting:
          $ref: '#/components/schemas/MultipleValuesSetting'
        subSlotSetting:
          $ref: '#/components/schemas/SubSlotSetting'
    UpdateSlotTypeResponse:
      type: object
      properties:
        slotTypeId:
          type: string
          minLength: 10
          maxLength: 10
          pattern: ^[0-9a-zA-Z]+$
          description: The unique identifier of the updated slot type.
        slotTypeName:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^([0-9a-zA-Z][_-]?){1,100}$
          description: The updated name of the slot type.
        description:
          type: string
          minLength: 0
          maxLength: 2000
          description: The updated description of the slot type.
        slotTypeValues:
          type: array
          items:
            $ref: '#/components/schemas/SlotTypeValue'
        valueSelectionSetting:
          $ref: '#/components/schemas/SlotValueSelectionSetting'
        parentSlotTypeSignature:
          type: string
          description: The updated signature of the built-in slot type that is the parent of this slot
            type.
        botId:
          type: string
          minLength: 10
          maxLength: 10
          pattern: ^[0-9a-zA-Z]+$
          description: The identifier of the bot that contains the slot type.
        botVersion:
          type: string
          minLength: 5
          maxLength: 5
          pattern: ^DRAFT$
          description: The version of the bot that contains the slot type. This is always DRAFT.
        localeId:
          type: string
          description: The language and locale of the updated slot type.
        creationDateTime:
          type: string
          format: date-time
          description: The timestamp of the date and time that the slot type was created.
        lastUpdatedDateTime:
          type: string
          format: date-time
          description: A timestamp of the date and time that the slot type was last updated.
        externalSourceSetting:
          $ref: '#/components/schemas/ExternalSourceSetting'
        compositeSlotTypeSetting:
          $ref: '#/components/schemas/CompositeSlotTypeSetting'
    UpdateTestSetResponse:
      type: object
      properties:
        testSetId:
          type: string
          minLength: 10
          maxLength: 10
          pattern: ^[0-9a-zA-Z]+$
          description: The test set Id for which update test operation to be performed.
        testSetName:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^([0-9a-zA-Z][_-]?){1,100}$
          description: The test set name for the updated test set.
        description:
          type: string
          minLength: 0
          maxLength: 2000
          description: The test set description for the updated test set.
        modality:
          type: string
          enum:
          - Text
          - Audio
          description: Indicates whether audio or text is used for the updated test set.
        status:
          type: string
          enum:
          - Importing
          - PendingAnnotation
          - Deleting
          - ValidationError
          - Ready
          description: The status for the updated test set.
        roleArn:
          type: string
          minLength: 32
          maxLength: 2048
          pattern: ^arn:aws:iam::[0-9]{12}:role/.*$
          description: The roleARN used for any operation in the test set to access resources in the Amazon
            Web Services account.
        numTurns:
          type: integer
          description: The number of conversation turns from the updated test set.
        storageLocation:
          $ref: '#/components/schemas/TestSetStorageLocation'
        creationDateTime:
          type: string
          format: date-time
          description: The creation date and time for the updated test set.
        lastUpdatedDateTime:
          type: string
          format: date-time
          description: The date and time of the last update for the updated test set.
    UserTurnInputSpecification:
      type: object
      description: Contains information about the user messages in the turn in the input.
      properties:
        utteranceInput:
          $ref: '#/components/schemas/UtteranceInputSpecification'
        requestAttributes:
          type: object
          additionalProperties:
            type: string
        sessionState:
          $ref: '#/components/schemas/InputSessionStateSpecification'
      required:
      - utteranceInput
    UserTurnIntentOutput:
      type: object
      description: Contains information about the intent that is output for the turn by the test execution.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^([0-9a-zA-Z][_-]?){1,100}$
          description: The name of the intent.
        slots:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/UserTurnSlotOutput'
      required:
      - name
    UserTurnOutputSpecification:
      type: object
      description: Contains results that are output for the user turn by the test execution.
      properties:
        intent:
          $ref: '#/components/schemas/UserTurnIntentOutput'
        activeContexts:
          type: array
          items:
            $ref: '#/components/schemas/ActiveContext'
        transcript:
          type: string
          minLength: 1
          maxLength: 1024
          description: The transcript that is output for the user turn by the test execution.
      required:
      - intent
    UserTurnResult:
      type: object
      description: Contains the results for the user turn by the test execution.
      properties:
        input:
          $ref: '#/components/schemas/UserTurnInputSpecification'
        expectedOutput:
          $ref: '#/components/schemas/UserTurnOutputSpecification'
        actualOutput:
          $ref: '#/components/schemas/UserTurnOutputSpecification'
        errorDetails:
          $ref: '#/components/schemas/ExecutionErrorDetails'
        endToEndResult:
          type: string
          enum:
          - Matched
          - Mismatched
          - ExecutionError
          description: Specifies whether the expected and actual outputs match or not, or if there is
            an error in execution.
        intentMatchResult:
          type: string
          enum:
          - Matched
          - Mismatched
          - ExecutionError
          description: Specifies whether the expected and actual intents match or not.
        slotMatchResult:
          type: string
          enum:
          - Matched
          - Mismatched
          - ExecutionError
          description: Specifies whether the expected and actual slots match or not.
        speechTranscriptionResult:
          type: string
          enum:
          - Matched
          - Mismatched
          - ExecutionError
          description: Specifies whether the expected and actual speech transcriptions match or not, or
            if there is an error in execution.
        conversationLevelResult:
          $ref: '#/components/schemas/ConversationLevelResultDetail'
      required:
      - input
      - expectedOutput
    UserTurnSlotOutput:
      type: object
      description: Contains information about a slot output by the test set execution.
      properties:
        value:
          type: string
          minLength: 1
          description: The value output by the slot recognition.
        values:
          type: array
          items:
            $ref: '#/components/schemas/UserTurnSlotOutput'
        subSlots:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/UserTurnSlotOutput'
    UserTurnSpecification:
      type: object
      description: Contains information about the expected and input values for the user turn.
      properties:
        input:
          $ref: '#/components/schemas/UserTurnInputSpecification'
        expected:
          $ref: '#/components/schemas/UserTurnOutputSpecification'
      required:
      - input
      - expected
    UtteranceAggregationDuration:
      type: object
      description: Provides parameters for setting the time window and duration for aggregating utterance
        data.
      properties:
        relativeAggregationDuration:
          $ref: '#/components/schemas/RelativeAggregationDuration'
      required:
      - relativeAggregationDuration
    UtteranceAudioInputSpecification:
      type: object
      description: Contains information about the audio for an utterance.
      properties:
        audioFileS3Location:
          type: string
          minLength: 1
          maxLength: 1024
          pattern: ^s3://([a-z0-9\\.-]+)/(.+)$
          description: Amazon S3 file pointing to the audio.
      required:
      - audioFileS3Location
    UtteranceBotResponse:
      type: object
      description: An object that contains a response to the utterance from the bot.
      properties:
        content:
          type: string
          description: The text of the response to the utterance from the bot.
        contentType:
          type: string
          enum:
          - PlainText
          - CustomPayload
          - SSML
          - ImageResponseCard
          description: 'The type of the response. The following values are possible: PlainText – A plain
            text string. CustomPayload – A response string that you can customize to include data or metadata
            for your application. SSML – A string that includes Speech Synthesis Markup Language to customize
            the audio response. ImageResponseCard – An image with buttons that the customer can select.
            See ImageResponseCard for more information.'
        imageResponseCard:
          $ref: '#/components/schemas/ImageResponseCard'
    UtteranceDataSortBy:
      type: object
      description: An object specifying the measure and method by which to sort the utterance data.
      properties:
        name:
          type: string
          enum:
          - UtteranceTimestamp
          description: The measure by which to sort the utterance analytics data. Count – The number of
            utterances. UtteranceTimestamp – The date and time of the utterance.
        order:
          type: string
          enum:
          - Ascending
          - Descending
          description: Specifies whether to sort the results in ascending or descending order.
      required:
      - name
      - order
    UtteranceInputSpecification:
      type: object
      description: Contains information about input of an utterance.
      properties:
        textInput:
          type: string
          minLength: 1
          maxLength: 1024
          description: A text input transcription of the utterance. It is only applicable for test-sets
            containing text data.
        audioInput:
          $ref: '#/components/schemas/UtteranceAudioInputSpecification'
    UtteranceLevelTestResultItem:
      type: object
      description: Contains information about multiple utterances in the results of a test set execution.
      properties:
        recordNumber:
          type: integer
          format: int64
          minimum: 1
          maximum: 200000
          description: The record number of the result.
        conversationId:
          type: string
          minLength: 1
          maxLength: 50
          pattern: ^([0-9a-zA-Z][_-]?)+$
          description: The unique identifier for the conversation associated with the result.
        turnResult:
          $ref: '#/components/schemas/TestSetTurnResult'
      required:
      - recordNumber
      - turnResult
    UtteranceLevelTestResults:
      type: object
      description: Contains information about the utterances in the results of the test set execution.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UtteranceLevelTestResultItem'
      required:
      - items
    UtteranceSpecification:
      type: object
      description: An object containing information about a specific utterance.
      properties:
        botAliasId:
          type: string
          minLength: 10
          maxLength: 10
          pattern: ^(\bTSTALIASID\b|[0-9a-zA-Z]+)$
          description: The identifier of the alias of the bot that the utterance was made to.
        botVersion:
          type: string
          minLength: 1
          maxLength: 5
          pattern: ^[0-9]+$
          description: The version of the bot that the utterance was made to.
        localeId:
          type: string
          description: The locale of the bot that the utterance was made to.
        sessionId:
          type: string
          pattern: ^[0-9a-zA-Z._:-]$
          description: The identifier of the session that the utterance was made in.
        channel:
          type: string
          minLength: 1
          maxLength: 50
          description: The channel that is integrated with the bot that the utterance was made to.
        mode:
          type: string
          enum:
          - Speech
          - Text
          - DTMF
          - MultiMode
          description: 'The mode of the session. The possible values are as follows: Speech – The session
            consisted of spoken dialogue. Text – The session consisted of written dialogue. DTMF – The
            session consisted of touch-tone keypad (Dual Tone Multi-Frequency) key presses. MultiMode
            – The session consisted of multiple modes.'
        conversationStartTime:
          type: string
          format: date-time
          description: The date and time when the conversation in which the utterance took place began.
            A conversation is defined as a unique combination of a sessionId and an originatingRequestId.
        conversationEndTime:
          type: string
          format: date-time
          description: The date and time when the conversation in which the utterance took place ended.
            A conversation is defined as a unique combination of a sessionId and an originatingRequestId.
        utterance:
          type: string
          description: The text of the utterance.
        utteranceTimestamp:
          type: string
          format: date-time
          description: The date and time when the utterance took place.
        audioVoiceDurationMillis:
          type: integer
          format: int64
          description: The duration in milliseconds of the audio associated with the utterance.
        utteranceUnderstood:
          type: boolean
          description: Specifies whether the bot understood the utterance or not.
        inputType:
          type: string
          description: 'The input type of the utterance. The possible values are as follows: PCM format:
            audio data must be in little-endian byte order. audio/l16; rate=16000; channels=1 audio/x-l16;
            sample-rate=16000; channel-count=1 audio/lpcm; sample-rate=8000; sample-size-bits=16; channel-count=1;
            is-big-endian=false Opus format audio/x-cbr-opus-with-preamble;preamble-size=0;bit-rate=256000;frame-size-milliseconds=4
            Text format text/plain; charset=utf-8'
        outputType:
          type: string
          description: 'The output type of the utterance. The possible values are as follows: audio/mpeg
            audio/ogg audio/pcm (16 KHz) audio/ (defaults to mpeg) text/plain; charset=utf-8'
        associatedIntentName:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^([0-9a-zA-Z][_-]?){1,100}$
          description: The name of the intent that the utterance is associated to.
        associatedSlotName:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^([0-9a-zA-Z][_-]?){1,100}$
          description: The name of the slot that the utterance is associated to.
        intentState:
          type: string
          enum:
          - Failed
          - Fulfilled
          - InProgress
          - ReadyForFulfillment
          - Waiting
          - FulfillmentInProgress
          description: The state of the intent that the utterance is associated to.
        dialogActionType:
          type: string
          description: The type of dialog action that the utterance is associated to. See the type field
            in DialogAction for more information.
        botResponseAudioVoiceId:
          type: string
          description: The identifier for the audio of the bot response.
        slotsFilledInSession:
          type: string
          description: The slots that have been filled in the session by the time of the utterance.
        utteranceRequestId:
          type: string
          minLength: 10
          maxLength: 10
          pattern: ^[0-9a-zA-Z]+$
          description: The identifier of the request associated with the utterance.
        botResponses:
          type: array
          items:
            $ref: '#/components/schemas/UtteranceBotResponse'
    ValidationException:
      type: object
      description: One of the input parameters in your request isn't valid. Check the parameters and try
        your request again.
      properties:
        message:
          type: string
    VoiceSettings:
      type: object
      description: 'Defines settings for using an Amazon Polly voice to communicate with a user. Valid
        values include: standard neural long-form generative'
      properties:
        engine:
          type: string
          enum:
          - standard
          - neural
          - long-form
          - generative
          description: Indicates the type of Amazon Polly voice that Amazon Lex should use for voice interaction
            with the user. For more information, see the engine parameter of the SynthesizeSpeech operation
            in the Amazon Polly developer guide. If you do not specify a value, the default is standard.
        voiceId:
          type: string
          description: The identifier of the Amazon Polly voice to use.
      required:
      - voiceId
    WaitAndContinueSpecification:
      type: object
      description: Specifies the prompts that Amazon Lex uses while a bot is waiting for customer input.
      properties:
        waitingResponse:
          $ref: '#/components/schemas/ResponseSpecification'
        continueResponse:
          $ref: '#/components/schemas/ResponseSpecification'
        stillWaitingResponse:
          $ref: '#/components/schemas/StillWaitingResponseSpecification'
        active:
          type: boolean
          description: Specifies whether the bot will wait for a user to respond. When this field is false,
            wait and continue responses for a slot aren't used. If the active field isn't specified, the
            default is true.
      required:
      - waitingResponse
      - continueResponse
