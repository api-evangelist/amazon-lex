model: >-
  AWS Signature Version 4 over IAM credentials. There are no API keys, no OAuth flow, no bearer tokens
  and no OIDC discovery document — /.well-known/openid-configuration and
  /.well-known/oauth-authorization-server 404 on every host probed. The OpenAPI securityScheme is
  typed apiKey/header only because OpenAPI has no native SigV4 type; the real mechanism is a signed
  canonical request, and a caller cannot construct one from a static header value.
