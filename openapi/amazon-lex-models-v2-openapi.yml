          type: object
          additionalProperties:
            type: integer
        slotMatchResultCounts:
          type: object
          additionalProperties:
            type: integer
      required:
      - totalResultCount
      - slotMatchResultCounts
    SlotSortBy:
      type: object
      description: Specifies attributes for sorting a list of bots.
      properties:
        attribute:
          type: string
          enum:
          - SlotName
          - LastUpdatedDateTime
          description: The attribute to use to sort the list.
        order:
          type: string
          enum:
          - Ascending
          - Descending
          description: The order to sort the list. You can choose ascending or descending.
      required:
      - attribute
      - order
    SlotSummary:
      type: object
      description: Summary information about a slot, a value that the bot elicits from the user.
      properties:
        slotId:
          type: string
          minLength: 10
          maxLength: 10
          pattern: ^[0-9a-zA-Z]+$
          description: The unique identifier of the slot.
        slotName:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^([0-9a-zA-Z][_-]?){1,100}$
          description: The name given to the slot.
        description:
          type: string
          minLength: 0
          maxLength: 2000
          description: The description of the slot.
        slotConstraint:
          type: string
          enum:
          - Required
          - Optional
          description: Whether the slot is required or optional. An intent is complete when all required
            slots are filled.
        slotTypeId:
          type: string
          minLength: 1
          maxLength: 25
          pattern: ^((AMAZON\.)[a-zA-Z_]+?|[0-9a-zA-Z]+)$
          description: The unique identifier for the slot type that defines the values for the slot.
        valueElicitationPromptSpecification:
          $ref: '#/components/schemas/PromptSpecification'
        lastUpdatedDateTime:
          type: string
          format: date-time
          description: The timestamp of the last date and time that the slot was updated.
    SlotTypeFilter:
      type: object
      description: Filters the response from the ListSlotTypes operation.
      properties:
        name:
          type: string
          enum:
          - SlotTypeName
          - ExternalSourceType
          description: The name of the field to use for filtering.
        values:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 100
            pattern: ^[0-9a-zA-Z_()\s-]+$
        operator:
          type: string
          enum:
          - CO
          - EQ
          description: The operator to use for the filter. Specify EQ when the ListSlotTypes operation
            should return only aliases that equal the specified value. Specify CO when the ListSlotTypes
            operation should return aliases that contain the specified value.
      required:
      - name
      - values
      - operator
    SlotTypeSortBy:
      type: object
      description: Specifies attributes for sorting a list of slot types.
      properties:
        attribute:
          type: string
          enum:
          - SlotTypeName
          - LastUpdatedDateTime
          description: The attribute to use to sort the list of slot types.
        order:
          type: string
          enum:
          - Ascending
          - Descending
          description: The order to sort the list. You can say ascending or descending.
      required:
      - attribute
      - order
    SlotTypeStatistics:
      type: object
      description: The object that contains the statistical summary of the recommended slot type associated
        with the bot recommendation.
      properties:
        discoveredSlotTypeCount:
          type: integer
          description: The number of recommended slot types associated with the bot recommendation.
    SlotTypeSummary:
      type: object
      description: Provides summary information about a slot type.
      properties:
        slotTypeId:
          type: string
          minLength: 10
          maxLength: 10
          pattern: ^[0-9a-zA-Z]+$
          description: The unique identifier assigned to the slot type.
        slotTypeName:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^([0-9a-zA-Z][_-]?){1,100}$
          description: The name of the slot type.
        description:
          type: string
          minLength: 0
          maxLength: 2000
          description: The description of the slot type.
        parentSlotTypeSignature:
          type: string
          description: If the slot type is derived from a built-on slot type, the name of the parent slot
            type.
        lastUpdatedDateTime:
          type: string
          format: date-time
          description: A timestamp of the date and time that the slot type was last updated.
        slotTypeCategory:
          type: string
          enum:
          - Custom
          - Extended
          - ExternalGrammar
          - Composite
          description: Indicates the type of the slot type. Custom - A slot type that you created using
            custom values. For more information, see Creating custom slot types. Extended - A slot type
            created by extending the AMAZON.AlphaNumeric built-in slot type. For more information, see
            AMAZON.AlphaNumeric . ExternalGrammar - A slot type using a custom GRXML grammar to define
            values. For more information, see Using a custom grammar slot type.
    SlotTypeValue:
      type: object
      description: Each slot type can have a set of values. Each SlotTypeValue represents a value that
        the slot type can take.
      properties:
        sampleValue:
          $ref: '#/components/schemas/SampleValue'
        synonyms:
          type: array
          items:
            $ref: '#/components/schemas/SampleValue'
    SlotValue:
      type: object
      description: The value to set in a slot.
      properties:
        interpretedValue:
          type: string
          minLength: 1
          description: The value that Amazon Lex determines for the slot. The actual value depends on
            the setting of the value selection strategy for the bot. You can choose to use the value entered
            by the user, or you can have Amazon Lex choose the first value in the resolvedValues list.
    SlotValueElicitationSetting:
      type: object
      description: Specifies the elicitation setting details eliciting a slot.
      properties:
        defaultValueSpecification:
          $ref: '#/components/schemas/SlotDefaultValueSpecification'
        slotConstraint:
          type: string
          enum:
          - Required
          - Optional
          description: Specifies whether the slot is required or optional.
        promptSpecification:
          $ref: '#/components/schemas/PromptSpecification'
        sampleUtterances:
          type: array
          items:
            $ref: '#/components/schemas/SampleUtterance'
        waitAndContinueSpecification:
          $ref: '#/components/schemas/WaitAndContinueSpecification'
        slotCaptureSetting:
          $ref: '#/components/schemas/SlotCaptureSetting'
        slotResolutionSetting:
          $ref: '#/components/schemas/SlotResolutionSetting'
      required:
      - slotConstraint
    SlotValueOverride:
      type: object
      description: The slot values that Amazon Lex uses when it sets slot values in a dialog step.
      properties:
        shape:
          type: string
          enum:
          - Scalar
          - List
          description: When the shape value is List, it indicates that the values field contains a list
            of slot values. When the value is Scalar, it indicates that the value field contains a single
            value.
        value:
          $ref: '#/components/schemas/SlotValue'
        values:
          type: array
          items:
            $ref: '#/components/schemas/SlotValueOverride'
    SlotValueRegexFilter:
      type: object
      description: Provides a regular expression used to validate the value of a slot.
      properties:
        pattern:
          type: string
          minLength: 1
          maxLength: 300
          description: 'A regular expression used to validate the value of a slot. Use a standard regular
            expression. Amazon Lex supports the following characters in the regular expression: A-Z, a-z
            0-9 Unicode characters ("\⁠u") Represent Unicode characters with four digits, for example
            "\⁠u0041" or "\⁠u005A". The following regular expression operators are not supported: Infinite
            repeaters: *, +, or {x,} with no upper bound. Wild card (.)'
      required:
      - pattern
    SlotValueSelectionSetting:
      type: object
      description: Contains settings used by Amazon Lex to select a slot value.
      properties:
        resolutionStrategy:
          type: string
          enum:
          - OriginalValue
          - TopResolution
          - Concatenation
          description: 'Determines the slot resolution strategy that Amazon Lex uses to return slot type
            values. The field can be set to one of the following values: ORIGINAL_VALUE - Returns the
            value entered by the user, if the user value is similar to the slot value. TOP_RESOLUTION
            - If there is a resolution list for the slot, return the first value in the resolution list
            as the slot type value. If there is no resolution list, null is returned. If you don''t specify
            the valueSelectionStrategy, the default is ORIGINAL_VALUE.'
        regexFilter:
          $ref: '#/components/schemas/SlotValueRegexFilter'
        advancedRecognitionSetting:
          $ref: '#/components/schemas/AdvancedRecognitionSetting'
      required:
      - resolutionStrategy
    Specifications:
      type: object
      description: Subslot specifications.
      properties:
        slotTypeId:
          type: string
          minLength: 1
          maxLength: 25
          pattern: ^((AMAZON\.)[a-zA-Z_]+?|[0-9a-zA-Z]+)$
          description: The unique identifier assigned to the slot type.
        valueElicitationSetting:
          $ref: '#/components/schemas/SubSlotValueElicitationSetting'
      required:
      - slotTypeId
      - valueElicitationSetting
    SpeechFoundationModel:
