paths:
  /bots:
    put:
      operationId: CreateBot
      summary: Creates an Amazon Lex conversational bot.
      description: Creates an Amazon Lex conversational bot.
      tags:
      - bots
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                botName:
                  type: string
                  minLength: 1
                  maxLength: 100
                  pattern: ^([0-9a-zA-Z][_-]?){1,100}$
                  description: The name of the bot. The bot name must be unique in the account that creates
                    the bot.
                description:
                  type: string
                  minLength: 0
                  maxLength: 2000
                  description: A description of the bot. It appears in lists to help you identify a particular
                    bot.
                roleArn:
                  type: string
                  minLength: 32
                  maxLength: 2048
                  pattern: ^arn:aws:iam::[0-9]{12}:role/.*$
                  description: The Amazon Resource Name (ARN) of an IAM role that has permission to access
                    the bot.
                dataPrivacy:
                  $ref: '#/components/schemas/DataPrivacy'
                idleSessionTTLInSeconds:
                  type: integer
                  minimum: 60
                  maximum: 86400
                  description: The time, in seconds, that Amazon Lex should keep information about a user's
                    conversation with the bot. A user interaction remains active for the amount of time
                    specified. If no conversation occurs during this time, the session expires and Amazon
                    Lex deletes any data provided before the timeout. You can specify between 60 (1 minute)
                    and 86,400 (24 hours) seconds.
                botTags:
                  type: object
                  additionalProperties:
                    type: string
                    minLength: 0
                    maxLength: 256
                testBotAliasTags:
                  type: object
                  additionalProperties:
                    type: string
                    minLength: 0
                    maxLength: 256
                botType:
                  type: string
                  enum:
                  - Bot
                  - BotNetwork
                  description: The type of a bot to create.
                botMembers:
                  type: array
                  items:
                    $ref: '#/components/schemas/BotMember'
                errorLogSettings:
                  $ref: '#/components/schemas/ErrorLogSettings'
              required:
              - botName
              - roleArn
              - dataPrivacy
              - idleSessionTTLInSeconds
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBotResponse'
        '400':
          description: ValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationException'
        '402':
          description: ServiceQuotaExceededException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceQuotaExceededException'
        '409':
          description: ConflictException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictException'
        '412':
          description: PreconditionFailedException
          content:
            application/json:
