      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^([0-9a-zA-Z][_-]?){1,100}$
          description: Name of a constituent sub slot inside a composite slot.
        slotTypeId:
          type: string
          minLength: 1
          maxLength: 25
          pattern: ^((AMAZON\.)[a-zA-Z_]+?|[0-9a-zA-Z]+)$
          description: The unique identifier assigned to a slot type. This refers to either a built-in
