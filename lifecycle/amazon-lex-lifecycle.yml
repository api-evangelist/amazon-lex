deprecation:
  policy_published: false
  sunset_headers: false
  deprecation_headers: false
  detail: >-
    Amazon Lex V2 publishes no deprecation policy page and emits no RFC 8594 Sunset or Deprecation
    response headers. No operation in either Smithy service model carries a `smithy.api#deprecated`
    trait. The only lifecycle transition AWS documents for Lex is the V1-to-V2 migration guide, which
    describes how to move a bot rather than when V1 stops answering.
  migration_guide: https://docs.aws.amazon.com/lexv2/latest/dg/migration.html
