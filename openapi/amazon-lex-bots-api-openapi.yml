      properties:
        replicaRegion:
          type: string
          minLength: 2
          maxLength: 25
          description: The replica region used in the replication statuses summary.
        creationDateTime:
          type: string
          format: date-time
          description: The creation time and date for the replicated bots.
        botReplicaStatus:
          type: string
          enum:
          - Enabling
          - Enabled
          - Deleting
          - Failed
          description: The operation status for the replicated bot applicable.
        failureReasons:
          type: array
          items:
            type: string
    ConditionalSpecification:
      type: object
      description: Provides a list of conditional branches. Branches are evaluated in the order that they are entered in the list. The first branch with a condition that evaluates to true is executed. The last branch in the list is the default branch. The default branch should not have any condition expression. The default branch is executed if no other branch has a matching condition.
      properties:
        active:
          type: boolean
          description: Determines whether a conditional branch is active. When active is false, the conditions are not evaluated.
        conditionalBranches:
          type: array
          items:
            $ref: '#/components/schemas/ConditionalBranch'
        defaultBranch:
          $ref: '#/components/schemas/DefaultConditionalBranch'
      required:
      - active
      - conditionalBranches
      - defaultBranch
    ConditionalBranch:
      type: object
      description: A set of actions that Amazon Lex should run if the condition is matched.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^([0-9a-zA-Z][_-]?){1,100}$
          description: The name of the branch.
        condition:
          $ref: '#/components/schemas/Condition'
        nextStep:
          $ref: '#/components/schemas/DialogState'
        response:
          $ref: '#/components/schemas/ResponseSpecification'
      required:
      - name
      - condition
      - nextStep
    DateRangeFilter:
      type: object
      description: The object used for specifying the data range that the customer wants Amazon Lex to read through in the input transcripts.
      properties:
        startDateTime:
          type: string
          format: date-time
          description: A timestamp indicating the start date for the date range filter.
        endDateTime:
          type: string
          format: date-time
          description: A timestamp indicating the end date for the date range filter.
      required:
      - startDateTime
      - endDateTime
    AggregatedUtterancesFilter:
      type: object
      description: Filters responses returned by the ListAggregatedUtterances operation.
      properties:
        name:
          type: string
          enum:
          - Utterance
          description: The name of the field to filter the utterance list.
        values:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 100
            pattern: ^[0-9a-zA-Z_()\s-]+$
        operator:
          type: string
          enum:
          - CO
          - EQ
          description: The operator to use for the filter. Specify EQ when the ListAggregatedUtterances operation should return only utterances that equal the specified value. Specify CO when the ListAggregatedUtterances operation should return utterances that contain the specified value.
      required:
      - name
      - values
      - operator
    UtteranceBotResponse:
      type: object
      description: An object that contains a response to the utterance from the bot.
      properties:
        content:
          type: string
          description: The text of the response to the utterance from the bot.
        contentType:
          type: string
          enum:
          - PlainText
          - CustomPayload
          - SSML
          - ImageResponseCard
          description: 'The type of the response. The following values are possible: PlainText – A plain text string. CustomPayload – A response string that you can customize to include data or metadata for your application. SSML – A string that includes Speech Synthesis Markup Language to customize the audio response. ImageResponseCard – An image with buttons that the customer can select. See ImageResponseCard for more information.'
        imageResponseCard:
          $ref: '#/components/schemas/ImageResponseCard'
    SpeechRecognitionSettings:
      type: object
      description: Settings that control how Amazon Lex processes and recognizes speech input from users.
      properties:
        speechModelPreference:
          type: string
          enum:
          - Standard
          - Neural
          - Deepgram
          description: The speech-to-text model to use.
        speechModelConfig:
          $ref: '#/components/schemas/SpeechModelConfig'
    AnalyticsUtteranceFilter:
      type: object
      description: 'Contains fields describing a condition by which to filter the utterances. The expression may be understood as name operator values. For example: LocaleId EQ Book – The locale is the string "en". UtteranceText CO help – The text of the utterance contains the string "help". The operators that each filter supports are listed below: BotAlias – EQ. BotVersion – EQ. LocaleId – EQ. Modality – EQ. Channel – EQ. SessionId – EQ. OriginatingRequestId – EQ. UtteranceState – EQ. UtteranceText – EQ, CO.'
      properties:
        name:
          type: string
          enum:
          - BotAliasId
          - BotVersion
          - LocaleId
          - Modality
          - Channel
          - SessionId
          - OriginatingRequestId
          - UtteranceState
          - UtteranceText
          description: 'The category by which to filter the utterances. The descriptions for each option are as follows: BotAlias – The name of the bot alias. BotVersion – The version of the bot. LocaleId – The locale of the bot. Modality – The modality of the session with the bot (audio, DTMF, or text). Channel – The channel that the bot is integrated with. SessionId – The identifier of the session with the bot. OriginatingRequestId – The identifier of the first request in a session. UtteranceState – The state of the utterance. UtteranceText – The text in the utterance.'
        operator:
          type: string
          enum:
          - EQ
          - GT
          - LT
          description: 'The operation by which to filter the category. The following operations are possible: CO – Contains EQ – Equals GT – Greater than LT – Less than The operators that each filter supports are listed below: BotAlias – EQ. BotVersion – EQ. LocaleId – EQ. Modality – EQ. Channel – EQ. SessionId – EQ. OriginatingRequestId – EQ. UtteranceState – EQ. UtteranceText – EQ, CO.'
        values:
          type: array
          items:
            type: string
      required:
      - name
      - operator
      - values
    DeleteBotResponse:
      type: object
      properties:
        botId:
          type: string
          minLength: 10
          maxLength: 10
          pattern: ^[0-9a-zA-Z]+$
