                $ref: '#/components/schemas/DependencyFailedException'
        '429':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException_2'
        '500':
          description: InternalServerException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerException_2'
        '502':
          description: BadGatewayException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadGatewayException'
    servers:
    - url: https://runtime-v2-lex.us-east-1.amazonaws.com
      description: Amazon Lex V2 Runtime endpoint (us-east-1; one regional endpoint per AWS Region — see https://docs.aws.amazon.com/general/latest/gr/lex.html)
components:
  schemas:
    DescribeBotAnalyzerRecommendationResponse:
      type: object
      properties:
        botId:
          type: string
          minLength: 10
          maxLength: 10
          pattern: ^[0-9a-zA-Z]+$
          description: The unique identifier of the bot.
        botVersion:
          type: string
          minLength: 5
          maxLength: 5
          pattern: ^DRAFT$
          description: The version of the bot that was analyzed.
        localeId:
          type: string
          description: The locale identifier of the bot locale that was analyzed.
        botAnalyzerStatus:
          type: string
          enum:
          - Processing
          - Available
          - Failed
          - Stopping
          - Stopped
          description: 'The current status of the analysis. Valid Values: Processing | Available | Failed | Stopping | Stopped'
        creationDateTime:
          type: string
          format: date-time
          description: The date and time when the analysis was initiated.
        botAnalyzerRecommendationList:
          type: array
          items:
            $ref: '#/components/schemas/BotAnalyzerRecommendation'
        nextToken:
          type: string
          description: If the response is truncated, this token can be used in a subsequent request to retrieve the next page of recommendations.
    SlotCaptureSetting:
      type: object
      description: Settings used when Amazon Lex successfully captures a slot value from a user.
      properties:
        captureResponse:
          $ref: '#/components/schemas/ResponseSpecification'
        captureNextStep:
          $ref: '#/components/schemas/DialogState'
        captureConditional:
          $ref: '#/components/schemas/ConditionalSpecification'
        failureResponse:
          $ref: '#/components/schemas/ResponseSpecification'
        failureNextStep:
          $ref: '#/components/schemas/DialogState'
        failureConditional:
          $ref: '#/components/schemas/ConditionalSpecification'
        codeHook:
          $ref: '#/components/schemas/DialogCodeHookInvocationSetting'
        elicitationCodeHook:
          $ref: '#/components/schemas/ElicitationCodeHookInvocationSetting'
    FulfillmentUpdatesSpecification:
      type: object
      description: Provides information for updating the user on the progress of fulfilling an intent.
      properties:
        active:
          type: boolean
          description: Determines whether fulfillment updates are sent to the user. When this field is true, updates are sent. If the active field is set to true, the startResponse, updateResponse, and timeoutInSeconds fields are required.
        startResponse:
          $ref: '#/components/schemas/FulfillmentStartResponseSpecification'
        updateResponse:
          $ref: '#/components/schemas/FulfillmentUpdateResponseSpecification'
        timeoutInSeconds:
          type: integer
          minimum: 1
          maximum: 900
          description: The length of time that the fulfillment Lambda function should run before it times out.
      required:
      - active
    SampleValue:
      type: object
      description: Defines one of the values for a slot type.
      properties:
        value:
          type: string
          minLength: 1
          maxLength: 140
          description: The value that can be used for a slot type.
      required:
      - value
    SlotTypeStatistics:
      type: object
      description: The object that contains the statistical summary of the recommended slot type associated with the bot recommendation.
      properties:
        discoveredSlotTypeCount:
          type: integer
          description: The number of recommended slot types associated with the bot recommendation.
    ListBotsResponse:
      type: object
      properties:
        botSummaries:
          type: array
          items:
            $ref: '#/components/schemas/BotSummary'
        nextToken:
          type: string
          description: A token that indicates whether there are more results to return in a response to the ListBots operation. If the nextToken field is present, you send the contents as the nextToken parameter of a ListBots operation request to get the next page of results.
    ObfuscationSetting:
      type: object
      description: Determines whether Amazon Lex obscures slot values in conversation logs.
      properties:
        obfuscationSettingType:
          type: string
          enum:
          - None
          - DefaultObfuscation
          description: Value that determines whether Amazon Lex obscures slot values in conversation logs. The default is to obscure the values.
      required:
      - obfuscationSettingType
    AnalyticsUtteranceAttribute:
      type: object
      description: An object that specifies the last used intent at the time of the utterance as an attribute to return.
      properties:
        name:
          type: string
          enum:
          - LastUsedIntent
          description: An attribute to return. The only available attribute is the intent that the bot mapped the utterance to.
      required:
      - name
    SlotSummary:
      type: object
      description: Summary information about a slot, a value that the bot elicits from the user.
      properties:
        slotId:
          type: string
          minLength: 10
          maxLength: 10
          pattern: ^[0-9a-zA-Z]+$
          description: The unique identifier of the slot.
        slotName:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^([0-9a-zA-Z][_-]?){1,100}$
          description: The name given to the slot.
        description:
          type: string
          minLength: 0
          maxLength: 2000
          description: The description of the slot.
        slotConstraint:
          type: string
          enum:
          - Required
          - Optional
          description: Whether the slot is required or optional. An intent is complete when all required slots are filled.
        slotTypeId:
          type: string
          minLength: 1
          maxLength: 25
          pattern: ^((AMAZON\.)[a-zA-Z_]+?|[0-9a-zA-Z]+)$
          description: The unique identifier for the slot type that defines the values for the slot.
        valueElicitationPromptSpecification:
          $ref: '#/components/schemas/PromptSpecification'
        lastUpdatedDateTime:
          type: string
          format: date-time
          description: The timestamp of the last date and time that the slot was updated.
    ListBotResourceGenerationsResponse:
      type: object
      properties:
        botId:
          type: string
          minLength: 10
          maxLength: 10
          pattern: ^[0-9a-zA-Z]+$
          description: The unique identifier of the bot for which the generation requests were made.
        botVersion:
          type: string
          minLength: 1
          maxLength: 5
          pattern: ^(DRAFT|[0-9]+)$
          description: The version of the bot for which the generation requests were made.
        localeId:
          type: string
          description: The locale of the bot for which the generation requests were made.
        generationSummaries:
          type: array
          items:
            $ref: '#/components/schemas/GenerationSummary'
        nextToken:
          type: string
          description: If the total number of results is greater than the number specified in the maxResults, the response returns a token in the nextToken field. Use this token when making a request to return the next batch of results.
    ServiceQuotaExceededException:
      type: object
      description: You have reached a quota for your bot.
      properties:
        message:
          type: string
    ListBotLocalesResponse:
      type: object
      properties:
        botId:
          type: string
          minLength: 10
          maxLength: 10
          pattern: ^[0-9a-zA-Z]+$
          description: The identifier of the bot to list locales for.
        botVersion:
          type: string
          minLength: 1
          maxLength: 5
          pattern: ^(DRAFT|[0-9]+)$
          description: The version of the bot.
        nextToken:
          type: string
          description: A token that indicates whether there are more results to return in a response to the ListBotLocales operation. If the nextToken field is present, you send the contents as the nextToken parameter of a ListBotLocales operation request to get the next page of results.
        botLocaleSummaries:
          type: array
          items:
            $ref: '#/components/schemas/BotLocaleSummary'
    AnalyticsIntentGroupByKey:
      type: object
      description: Contains the category by which the intent analytics were grouped and a member of that category.
      properties:
        name:
          type: string
          enum:
          - IntentName
          - IntentEndState
          - IntentLevel
          description: A category by which the intent analytics were grouped.
        value:
          type: string
          description: A member of the category by which the intent analytics were grouped.
    AllowedInputTypes:
      type: object
      description: Specifies the allowed input types.
      properties:
        allowAudioInput:
          type: boolean
          description: Indicates whether audio input is allowed.
        allowDTMFInput:
          type: boolean
          description: Indicates whether DTMF input is allowed.
      required:
      - allowAudioInput
      - allowDTMFInput
    IntentSortBy:
      type: object
      description: Specifies attributes for sorting a list of intents.
      properties:
        attribute:
          type: string
          enum:
          - IntentName
          - LastUpdatedDateTime
          description: The attribute to use to sort the list of intents.
        order:
          type: string
          enum:
          - Ascending
          - Descending
          description: The order to sort the list. You can choose ascending or descending.
      required:
      - attribute
      - order
    AnalyticsSessionResult:
      type: object
      description: An object containing the results for the session metrics you requested and the bin and/or group(s) they refer to, if applicable.
      properties:
        binKeys:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsBinKey'
        groupByKeys:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsSessionGroupByKey'
        metricsResults:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsSessionMetricResult'
    KendraConfiguration:
      type: object
      description: Provides configuration information for the AMAZON.KendraSearchIntent intent. When you use this intent, Amazon Lex searches the specified Amazon Kendra index and returns documents from the index that match the user's utterance.
      properties:
        kendraIndex:
          type: string
          minLength: 32
          maxLength: 2048
          pattern: ^arn:aws:kendra:[a-z]+-[a-z]+-[0-9]:[0-9]{12}:index\/[a-zA-Z0-9][a-zA-Z0-9_-]*$
          description: The Amazon Resource Name (ARN) of the Amazon Kendra index that you want the AMAZON.KendraSearchIntent intent to search. The index must be in the same account and Region as the Amazon Lex bot.
        queryFilterStringEnabled:
          type: boolean
          description: Determines whether the AMAZON.KendraSearchIntent intent uses a custom query string to query the Amazon Kendra index.
        queryFilterString:
          type: string
          minLength: 1
          maxLength: 5000
          description: A query filter that Amazon Lex sends to Amazon Kendra to filter the response from a query. The filter is in the format defined by Amazon Kendra. For more information, see Filtering queries.
      required:
      - kendraIndex
    CustomVocabularyEntryId:
      type: object
      description: The unique entry identifier for the custom vocabulary items.
      properties:
        itemId:
          type: string
          minLength: 1
          maxLength: 32
          description: The unique item identifier for the custom vocabulary items.
      required:
      - itemId
    DeleteBotReplicaResponse:
      type: object
      properties:
        botId:
          type: string
          minLength: 10
          maxLength: 10
          pattern: ^[0-9a-zA-Z]+$
          description: The unique bot ID of the replicated bot generated.
        replicaRegion:
          type: string
          minLength: 2
          maxLength: 25
          description: The region of the replicated bot generated.
        botReplicaStatus:
          type: string
          enum:
          - Enabling
          - Enabled
          - Deleting
          - Failed
          description: The operational status of the replicated bot generated.
    TextInputSpecification:
      type: object
      description: Specifies the text input specifications.
      properties:
        startTimeoutMs:
          type: integer
          minimum: 1
          description: Time for which a bot waits before re-prompting a customer for text input.
      required:
      - startTimeoutMs
    SubSlotValueElicitationSetting:
      type: object
      description: Subslot elicitation settings. DefaultValueSpecification is a list of default values for a constituent sub slot in a composite slot. Default values are used when Amazon Lex hasn't determined a value for a slot. You can specify default values from context variables, session attributes, and defined values. This is similar to DefaultValueSpecification for slots. PromptSpecification is the prompt that Amazon Lex uses to elicit the sub slot value from the user. This is similar to PromptSpecification for slots.
      properties:
        defaultValueSpecification:
          $ref: '#/components/schemas/SlotDefaultValueSpecification'
        promptSpecification:
          $ref: '#/components/schemas/PromptSpecification'
        sampleUtterances:
          type: array
          items:
            $ref: '#/components/schemas/SampleUtterance'
        waitAndContinueSpecification:
          $ref: '#/components/schemas/WaitAndContinueSpecification'
      required:
      - promptSpecification
    InternalServerException:
      type: object
      description: The service encountered an unexpected condition. Try your request again.
      properties:
        message:
          type: string
    BuildtimeSettings:
      type: object
      description: Contains specifications about the Amazon Lex build time generative AI capabilities from Amazon Bedrock that you can turn on for your bot.
      properties:
        descriptiveBotBuilder:
          $ref: '#/components/schemas/DescriptiveBotBuilderSpecification'
        sampleUtteranceGeneration:
          $ref: '#/components/schemas/SampleUtteranceGenerationSpecification'
    BotLocaleHistoryEvent:
      type: object
      description: Provides information about an event that occurred affecting the bot locale.
      properties:
        event:
          type: string
          description: A description of the event that occurred.
        eventDate:
          type: string
          format: date-time
          description: A timestamp of the date and time that the event occurred.
      required:
      - event
      - eventDate
    ListUtteranceAnalyticsDataResponse:
      type: object
      properties:
        botId:
          type: string
          minLength: 10
          maxLength: 10
          pattern: ^[0-9a-zA-Z]+$
          description: The unique identifier of the bot that the utterances belong to.
        nextToken:
          type: string
          description: If the response from the ListUtteranceAnalyticsData operation contains more results than specified in the maxResults parameter, a token is returned in the response. Use the returned token in the nextToken parameter of a ListUtteranceAnalyticsData request to return the next page of results. For a complete set of results, call the ListUtteranceAnalyticsData operation until the nextToken returned in the response is null.
        utterances:
          type: array
          items:
            $ref: '#/components/schemas/UtteranceSpecification'
    GrammarSlotTypeSource:
      type: object
      description: Describes the Amazon S3 bucket name and location for the grammar that is the source for the slot type.
      properties:
        s3BucketName:
          type: string
          minLength: 3
          maxLength: 63
          pattern: ^[a-z0-9][\.\-a-z0-9]{1,61}[a-z0-9]$
          description: The name of the Amazon S3 bucket that contains the grammar source.
        s3ObjectKey:
          type: string
          minLength: 1
          maxLength: 1024
          pattern: ^[\.\-\!\*\_\'\(\)a-zA-Z0-9][\.\-\!\*\_\'\(\)\/a-zA-Z0-9]*$
          description: The path to the grammar in the Amazon S3 bucket.
        kmsKeyArn:
          type: string
          minLength: 20
          maxLength: 2048
          pattern: ^arn:[\w\-]+:kms:[\w\-]+:[\d]{12}:(?:key\/[\w\-]+|alias\/[a-zA-Z0-9:\/_\-]{1,256})$
          description: The KMS key required to decrypt the contents of the grammar, if any.
      required:
      - s3BucketName
      - s3ObjectKey
    DTMFSpecification:
      type: object
      description: Specifies the DTMF input specifications.
      properties:
        maxLength:
          type: integer
          minimum: 1
          maximum: 1024
          description: The maximum number of DTMF digits allowed in an utterance.
        endTimeoutMs:
          type: integer
          minimum: 1
          description: How long the bot should wait after the last DTMF character input before assuming that the input has concluded.
        deletionCharacter:
          type: string
          pattern: ^[A-D0-9#*]{1}$
          description: The DTMF character that clears the accumulated DTMF digits and immediately ends the input.
        endCharacter:
          type: string
          pattern: ^[A-D0-9#*]{1}$
          description: The DTMF character that immediately ends input. If the user does not press this character, the input ends after the end timeout.
      required:
      - maxLength
      - endTimeoutMs
      - deletionCharacter
      - endCharacter
    AnalyticsUtteranceResult:
      type: object
      description: An object containing the results for the utterance metrics you requested and the bin and/or group(s) they refer to, if applicable.
      properties:
        binKeys:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsBinKey'
        groupByKeys:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsUtteranceGroupByKey'
        metricsResults:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsUtteranceMetricResult'
        attributeResults:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsUtteranceAttributeResult'
    SampleUtterance:
      type: object
      description: A sample utterance that invokes an intent or respond to a slot elicitation prompt.
      properties:
        utterance:
          type: string
          description: The sample utterance that Amazon Lex uses to build its machine-learning model to recognize intents.
      required:
      - utterance
    PostDialogCodeHookInvocationSpecification:
      type: object
      description: Specifies next steps to run after the dialog code hook finishes.
      properties:
        successResponse:
          $ref: '#/components/schemas/ResponseSpecification'
        successNextStep:
          $ref: '#/components/schemas/DialogState'
        successConditional:
          $ref: '#/components/schemas/ConditionalSpecification'
        failureResponse:
          $ref: '#/components/schemas/ResponseSpecification'
        failureNextStep:
          $ref: '#/components/schemas/DialogState'
        failureConditional:
          $ref: '#/components/schemas/ConditionalSpecification'
        timeoutResponse:
          $ref: '#/components/schemas/ResponseSpecification'
        timeoutNextStep:
          $ref: '#/components/schemas/DialogState'
        timeoutConditional:
          $ref: '#/components/schemas/ConditionalSpecification'
    AnalyticsIntentStageGroupByKey:
      type: object
      description: Contains the category by which the intent stage analytics and the values for that category were grouped.
      properties:
        name:
          type: string
          enum:
          - IntentStageName
          - SwitchedToIntent
          description: A category by which the intent stage analytics were grouped.
        value:
          type: string
          description: A member of the category by which the intent stage analytics were grouped.
    AnalyticsUtteranceGroupByKey:
      type: object
      description: Contains the category by which the utterance analytics were grouped and the values for that category.
      properties:
        name:
          type: string
          enum:
          - UtteranceText
          - UtteranceState
          description: The category by which the utterance analytics were grouped.
        value:
          type: string
          description: A member of the category by which the utterance analytics were grouped.
    IntentDisambiguationSettings:
      type: object
      description: Configures the Intent Disambiguation feature that helps resolve ambiguous user inputs when multiple intents could match. When enabled, the system presents clarifying questions to users, helping them specify their exact intent for improved conversation accuracy.
      properties:
        enabled:
          type: boolean
          description: Determines whether the Intent Disambiguation feature is enabled. When set to true, Amazon Lex will present disambiguation options to users when multiple intents could match their input, with the default being false.
        maxDisambiguationIntents:
          type: integer
          minimum: 2
          maximum: 5
          description: Specifies the maximum number of intent options (2-5) to present to users when disambiguation is needed. This setting determines how many intent options will be shown to users when the system detects ambiguous input. The default value is 3.
        customDisambiguationMessage:
          type: string
          minLength: 1
          maxLength: 1000
          description: Provides a custom message that will be displayed before presenting the disambiguation options to users. This message helps set the context for users and can be customized to match your bot's tone and brand. If not specified, a default message will be used.
      required:
      - enabled
    BatchCreateCustomVocabularyItemResponse:
      type: object
      properties:
        botId:
          type: string
          minLength: 10
          maxLength: 10
          pattern: ^[0-9a-zA-Z]+$
          description: The identifier of the bot associated with this custom vocabulary.
        botVersion:
          type: string
          minLength: 1
          maxLength: 5
          pattern: ^(DRAFT|[0-9]+)$
          description: The identifier of the version of the bot associated with this custom vocabulary.
        localeId:
          type: string
          description: The identifier of the language and locale where this custom vocabulary is used. The string must match one of the supported locales. For more information, see Supported Languages .
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FailedCustomVocabularyItem'
        resources:
          type: array
          items:
            $ref: '#/components/schemas/CustomVocabularyItem'
    DescribeBotReplicaResponse:
      type: object
      properties:
        botId:
          type: string
          minLength: 10
          maxLength: 10
          pattern: ^[0-9a-zA-Z]+$
          description: The unique bot ID of the replicated bot being monitored.
        replicaRegion:
          type: string
          minLength: 2
          maxLength: 25
          description: The region of the replicated bot being monitored.
        sourceRegion:
          type: string
          minLength: 2
          maxLength: 25
          description: The source region of the replicated bot being monitored.
        creationDateTime:
          type: string
          format: date-time
          description: The creation date and time of the replicated bot being monitored.
        botReplicaStatus:
          type: string
          enum:
          - Enabling
          - Enabled
          - Deleting
          - Failed
          description: The operational status of the replicated bot being monitored.
        failureReasons:
          type: array
          items:
            type: string
    ListSlotsResponse:
      type: object
      properties:
        botId:
          type: string
          minLength: 10
          maxLength: 10
          pattern: ^[0-9a-zA-Z]+$
          description: The identifier of the bot that contains the slots.
        botVersion:
          type: string
          minLength: 1
          maxLength: 5
          pattern: ^(DRAFT|[0-9]+)$
          description: The version of the bot that contains the slots.
        localeId:
          type: string
          description: The language and locale of the slots in the list.
        intentId:
          type: string
          minLength: 10
          maxLength: 10
          pattern: ^[0-9a-zA-Z]+$
          description: The identifier of the intent that contains the slots.
        slotSummaries:
          type: array
          items:
            $ref: '#/components/schemas/SlotSummary'
        nextToken:
          type: string
          description: A token that indicates whether there are more results to return in a response to the ListSlots operation. If the nextToken field is present, you send the contents as the nextToken parameter of a ListSlots operation request to get the next page of results.
    UtteranceSpecification:
      type: object
      description: An object containing information about a specific utterance.
      properties:
        botAliasId:
          type: string
          minLength: 10
          maxLength: 10
          pattern: ^(\bTSTALIASID\b|[0-9a-zA-Z]+)$
          description: The identifier of the alias of the bot that the utterance was made to.
        botVersion:
          type: string
          minLength: 1
          maxLength: 5
          pattern: ^[0-9]+$
          description: The version of the bot that the utterance was made to.
        localeId:
          type: string
          description: The locale of the bot that the utterance was made to.
        sessionId:
          type: string
          pattern: ^[0-9a-zA-Z._:-]$
          description: The identifier of the session that the utterance was made in.
        channel:
          type: string
          minLength: 1
          maxLength: 50
          description: The channel that is integrated with the bot that the utterance was made to.
        mode:
          type: string
          enum:
          - Speech
          - Text
          - DTMF
          - MultiMode
          description: 'The mode of the session. The possible values are as follows: Speech – The session consisted of spoken dialogue. Text – The session consisted of written dialogue. DTMF – The session consisted of touch-tone keypad (Dual Tone Multi-Frequency) key presses. MultiMode – The session consisted of multiple modes.'
        conversationStartTime:
          type: string
          format: date-time
          description: The date and time when the conversation in which the utterance took place began. A conversation is defined as a unique combination of a sessionId and an originatingRequestId.
        conversationEndTime:
          type: string
          format: date-time
          description: The date and time when the conversation in which the utterance took place ended. A conversation is defined as a unique combination of a sessionId and an originatingRequestId.
        utterance:
          type: string
          description: The text of the utterance.
        utteranceTimestamp:
          type: string
          format: date-time
          description: The date and time when the utterance took place.
        audioVoiceDurationMillis:
          type: integer
          format: int64
          description: The duration in milliseconds of the audio associated with the utterance.
        utteranceUnderstood:
          type: boolean
          description: Specifies whether the bot understood the utterance or not.
        inputType:
          type: string
          description: 'The input type of the utterance. The possible values are as follows: PCM format: audio data must be in little-endian byte order. audio/l16; rate=16000; channels=1 audio/x-l16; sample-rate=16000; channel-count=1 audio/lpcm; sample-rate=8000; sample-size-bits=16; channel-count=1; is-big-endian=false Opus format audio/x-cbr-opus-with-preamble;preamble-size=0;bit-rate=256000;frame-size-milliseconds=4 Text format text/plain; charset=utf-8'
        outputType:
          type: string
          description: 'The output type of the utterance. The possible values are as follows: audio/mpeg audio/ogg audio/pcm (16 KHz) audio/ (defaults to mpeg) text/plain; charset=utf-8'
        associatedIntentName:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^([0-9a-zA-Z][_-]?){1,100}$
          description: The name of the intent that the utterance is associated to.
        associatedSlotName:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^([0-9a-zA-Z][_-]?){1,100}$
          description: The name of the slot that the utterance is associated to.
        intentState:
          type: string
          enum:
          - Failed
          - Fulfilled
          - InProgress
          - ReadyForFulfillment
          - Waiting
          - FulfillmentInProgress
          description: The state of the intent that the utterance is associated to.
        dialogActionType:
          type: string
          description: The type of dialog action that the utterance is associated to. See the type field in DialogAction for more information.
        botResponseAudioVoiceId:
          type: string
