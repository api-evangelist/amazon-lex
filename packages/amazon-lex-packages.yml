  note: >-
    Every per-service Lex module was republished within nine days of this probe. There is no abandonment
    signal here — the AWS SDKs regenerate from the same Smithy models captured in smithy/ on a near-daily
    release train, so an SDK version lag is not a usable signal of Lex API decay the way it is for a
    single-product vendor.
