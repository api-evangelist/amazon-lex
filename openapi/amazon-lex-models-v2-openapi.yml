                    returned.
                nextToken:
                  type: string
                  description: If the response from the ListIntentMetrics operation contains more results
                    than specified in the maxResults parameter, a token is returned in the response. Use
                    the returned token in the nextToken parameter of a ListIntentMetrics request to return
                    the next page of results. For a complete set of results, call the ListIntentMetrics
                    operation until the nextToken returned in the response is null.
              required:
              - startDateTime
              - endDateTime
