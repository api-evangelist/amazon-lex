            slots are only available in the en-US locale. If you set this value to true in any other locale,
            Amazon Lex throws a ValidationException. If the allowMutlipleValues is not set, the default
            value is false.
    NewCustomVocabularyItem:
      type: object
      description: The new custom vocabulary item from the custom vocabulary list.
      properties:
        phrase:
          type: string
          minLength: 1
          maxLength: 100
          description: The unique phrase for the new custom vocabulary item from the custom vocabulary
            list.
        weight:
          type: integer
          minimum: 0
          maximum: 3
          description: The weight assigned to the new custom vocabulary item from the custom vocabulary
            list.
        displayAs:
          type: string
          minLength: 1
          maxLength: 100
          description: The display as value assigned to the new custom vocabulary item from the custom
            vocabulary list.
      required:
      - phrase
    NluImprovementSpecification:
      type: object
      description: Configures the Assisted Natural Language Understanding (NLU) feature for your bot.
        This specification determines whether enhanced intent recognition and utterance understanding
        capabilities are active.
      properties:
        enabled:
          type: boolean
          description: Determines whether the Assisted NLU feature is enabled for the bot. When set to
            true, Amazon Lex uses advanced models to improve intent recognition and slot resolution, with
            the default being false.
        assistedNluMode:
          type: string
          enum:
          - Primary
          - Fallback
          description: Specifies the mode for Assisted NLU operation. Use Primary to make Assisted NLU
            the primary intent recognition method, or Fallback to use it only when standard NLU confidence
            is low.
        intentDisambiguationSettings:
          $ref: '#/components/schemas/IntentDisambiguationSettings'
      required:
      - enabled
    ObfuscationSetting:
      type: object
      description: Determines whether Amazon Lex obscures slot values in conversation logs.
      properties:
        obfuscationSettingType:
          type: string
          enum:
          - None
          - DefaultObfuscation
          description: Value that determines whether Amazon Lex obscures slot values in conversation logs.
            The default is to obscure the values.
      required:
      - obfuscationSettingType
    OpensearchConfiguration:
      type: object
      description: Contains details about the configuration of the Amazon OpenSearch Service database
        used for the AMAZON.QnAIntent.
      properties:
        domainEndpoint:
          type: string
          pattern: ^(http|https):\/\/+[^\s]+[\w]$
          description: The endpoint of the Amazon OpenSearch Service domain.
        indexName:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^(?![_-])[a-z0-9][a-z0-9_\-]{0,254}$
          description: The name of the Amazon OpenSearch Service index.
        exactResponse:
          type: boolean
          description: Specifies whether to return an exact response or to return an answer generated
            by the model using the fields you specify from the database.
        exactResponseFields:
          $ref: '#/components/schemas/ExactResponseFields'
        includeFields:
          type: array
          items:
            type: string
      required:
      - domainEndpoint
      - indexName
    OutputContext:
      type: object
      description: Describes a session context that is activated when an intent is fulfilled.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^([0-9a-zA-Z][_-]?){1,100}$
          description: The name of the output context.
        timeToLiveInSeconds:
          type: integer
          minimum: 5
          maximum: 86400
          description: The amount of time, in seconds, that the output context should remain active. The
            time is figured from the first time the context is sent to the user.
        turnsToLive:
          type: integer
          minimum: 1
          maximum: 20
          description: The number of conversation turns that the output context should remain active.
            The number of turns is counted from the first time that the context is sent to the user.
      required:
      - name
      - timeToLiveInSeconds
      - turnsToLive
    OverallTestResultItem:
      type: object
      description: Information about the overall results for a test execution result.
      properties:
        multiTurnConversation:
          type: boolean
          description: Indicates whether the conversation contains multiple turns or not.
        totalResultCount:
          type: integer
          description: The total number of overall results in the result of the test execution.
        speechTranscriptionResultCounts:
          type: object
          additionalProperties:
            type: integer
        endToEndResultCounts:
          type: object
          additionalProperties:
            type: integer
      required:
      - multiTurnConversation
      - totalResultCount
      - endToEndResultCounts
    OverallTestResults:
      type: object
      description: Information about the overall test results.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OverallTestResultItem'
      required:
      - items
    ParentBotNetwork:
      type: object
      description: A network of bots.
      properties:
        botId:
          type: string
          minLength: 10
          maxLength: 10
          pattern: ^[0-9a-zA-Z]+$
          description: The identifier of the network of bots assigned by Amazon Lex.
        botVersion:
          type: string
          minLength: 1
          maxLength: 5
          pattern: ^(DRAFT|[0-9]+)$
          description: The version of the network of bots.
      required:
      - botId
      - botVersion
    PathFormat:
      type: object
      description: The object that contains a path format that will be applied when Amazon Lex reads the
        transcript file in the bucket you provide. Specify this object if you only want Lex to read a
        subset of files in your Amazon S3 bucket.
      properties:
        objectPrefixes:
          type: array
          items:
            type: string
            minLength: 1
            pattern: ^[\/]?+[a-zA-Z0-9!_.*'()-]+(\/[a-zA-Z0-9!_.*'()-]+)*$
    PlainTextMessage:
      type: object
      description: Defines an ASCII text message to send to the user.
      properties:
        value:
          type: string
          minLength: 1
          maxLength: 1000
          description: The message to send to the user.
      required:
      - value
    PostDialogCodeHookInvocationSpecification:
      type: object
      description: Specifies next steps to run after the dialog code hook finishes.
      properties:
        successResponse:
          $ref: '#/components/schemas/ResponseSpecification'
        successNextStep:
          $ref: '#/components/schemas/DialogState'
        successConditional:
          $ref: '#/components/schemas/ConditionalSpecification'
        failureResponse:
          $ref: '#/components/schemas/ResponseSpecification'
        failureNextStep:
          $ref: '#/components/schemas/DialogState'
        failureConditional:
          $ref: '#/components/schemas/ConditionalSpecification'
        timeoutResponse:
          $ref: '#/components/schemas/ResponseSpecification'
        timeoutNextStep:
          $ref: '#/components/schemas/DialogState'
        timeoutConditional:
          $ref: '#/components/schemas/ConditionalSpecification'
    PostFulfillmentStatusSpecification:
      type: object
      description: Provides a setting that determines whether the post-fulfillment response is sent to
        the user. For more information, see https://docs.aws.amazon.com/lexv2/latest/dg/streaming-progress.html#progress-complete
      properties:
        successResponse:
          $ref: '#/components/schemas/ResponseSpecification'
        failureResponse:
          $ref: '#/components/schemas/ResponseSpecification'
        timeoutResponse:
          $ref: '#/components/schemas/ResponseSpecification'
        successNextStep:
          $ref: '#/components/schemas/DialogState'
        successConditional:
          $ref: '#/components/schemas/ConditionalSpecification'
        failureNextStep:
          $ref: '#/components/schemas/DialogState'
        failureConditional:
          $ref: '#/components/schemas/ConditionalSpecification'
        timeoutNextStep:
          $ref: '#/components/schemas/DialogState'
        timeoutConditional:
          $ref: '#/components/schemas/ConditionalSpecification'
    PreconditionFailedException:
      type: object
      description: Your request couldn't be completed because one or more request fields aren't valid.
        Check the fields in your request and try again.
      properties:
        message:
          type: string
    Principal:
      type: object
      description: 'The IAM principal that you allowing or denying access to an Amazon Lex action. You
        must provide a service or an arn, but not both in the same statement. For more information, see
        AWS JSON policy elements: Principal .'
      properties:
        service:
          type: string
          minLength: 15
          maxLength: 1024
          pattern: ^[0-9a-zA-Z_.]+$
          description: The name of the Amazon Web Services service that should allowed or denied access
            to an Amazon Lex action.
        arn:
          type: string
          minLength: 30
          maxLength: 1024
          pattern: ^arn:aws:iam::[0-9]{12}:(root|(user|role)/.*)$
          description: The Amazon Resource Name (ARN) of the principal.
    PromptAttemptSpecification:
      type: object
      description: Specifies the settings on a prompt attempt.
      properties:
        allowInterrupt:
          type: boolean
          description: Indicates whether the user can interrupt a speech prompt attempt from the bot.
        allowedInputTypes:
          $ref: '#/components/schemas/AllowedInputTypes'
        audioAndDTMFInputSpecification:
          $ref: '#/components/schemas/AudioAndDTMFInputSpecification'
        textInputSpecification:
          $ref: '#/components/schemas/TextInputSpecification'
      required:
      - allowedInputTypes
    PromptSpecification:
      type: object
      description: Specifies a list of message groups that Amazon Lex sends to a user to elicit a response.
      properties:
        messageGroups:
          type: array
          items:
            $ref: '#/components/schemas/MessageGroup'
        maxRetries:
          type: integer
          minimum: 0
          maximum: 5
          description: The maximum number of times the bot tries to elicit a response from the user using
            this prompt.
        allowInterrupt:
          type: boolean
          description: Indicates whether the user can interrupt a speech prompt from the bot.
        messageSelectionStrategy:
          type: string
          enum:
          - Random
          - Ordered
          description: Indicates how a message is selected from a message group among retries.
        promptAttemptsSpecification:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PromptAttemptSpecification'
      required:
      - messageGroups
      - maxRetries
    QInConnectAssistantConfiguration:
      type: object
      description: The configuration details of the Qinconnect assistant.
      properties:
        assistantArn:
          type: string
          pattern: ^arn:[a-z-]*?:wisdom:[a-z0-9-]*?:[0-9]{12}:[a-z-]*?/[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}(?:/[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}){0,2}$
          description: The assistant Arn details of the Qinconnect assistant configuration.
      required:
      - assistantArn
    QInConnectIntentConfiguration:
      type: object
      description: The configuration details of the Qinconnect intent.
      properties:
        qInConnectAssistantConfiguration:
          $ref: '#/components/schemas/QInConnectAssistantConfiguration'
    QnAIntentConfiguration:
      type: object
      description: Details about the the configuration of the built-in Amazon.QnAIntent.
      properties:
        dataSourceConfiguration:
          $ref: '#/components/schemas/DataSourceConfiguration'
        bedrockModelConfiguration:
          $ref: '#/components/schemas/BedrockModelSpecification'
    QnAKendraConfiguration:
      type: object
      description: Contains details about the configuration of the Amazon Kendra index used for the AMAZON.QnAIntent.
      properties:
        kendraIndex:
          type: string
          minLength: 32
          maxLength: 2048
          pattern: ^arn:aws:kendra:[a-z]+-[a-z]+-[0-9]:[0-9]{12}:index\/[a-zA-Z0-9][a-zA-Z0-9_-]*$
          description: The ARN of the Amazon Kendra index to use.
        queryFilterStringEnabled:
          type: boolean
          description: Specifies whether to enable an Amazon Kendra filter string or not.
        queryFilterString:
          type: string
          minLength: 1
          maxLength: 5000
          description: Contains the Amazon Kendra filter string to use if enabled. For more information
            on the Amazon Kendra search filter JSON format, see Using document attributes to filter search
            results.
        exactResponse:
          type: boolean
          description: Specifies whether to return an exact response from the Amazon Kendra index or to
            let the Amazon Bedrock model you select generate a response based on the results. To use this
            feature, you must first add FAQ questions to your index by following the steps at Adding frequently
            asked questions (FAQs) to an index.
      required:
      - kendraIndex
    RecommendedIntentSummary:
      type: object
      description: An object that contains a summary of a recommended intent.
      properties:
        intentId:
          type: string
          minLength: 10
          maxLength: 10
          pattern: ^[0-9a-zA-Z]+$
          description: The unique identifier of a recommended intent associated with the bot recommendation.
        intentName:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^([0-9a-zA-Z][_-]?){1,100}$
          description: The name of a recommended intent associated with the bot recommendation.
        sampleUtterancesCount:
          type: integer
          description: The count of sample utterances of a recommended intent that is associated with
            a bot recommendation.
    RelativeAggregationDuration:
      type: object
      description: Specifies the time window that utterance statistics are returned for. The time window
        is always relative to the last time that the that utterances were aggregated. For example, if
        the ListAggregatedUtterances operation is called at 1600, the time window is set to 1 hour, and
        the last refresh time was 1530, only utterances made between 1430 and 1530 are returned. You can
        choose the time window that statistics should be returned for. Hours - You can request utterance
        statistics for 1, 3, 6, 12, or 24 hour time windows. Statistics are refreshed every half hour
        for 1 hour time windows, and hourly for the other time windows. Days - You can request utterance
        statistics for 3 days. Statistics are refreshed every 6 hours. Weeks - You can see statistics
        for one or two weeks. Statistics are refreshed every 12 hours for one week time windows, and once
        per day for two week time windows.
      properties:
        timeDimension:
          type: string
          enum:
          - Hours
          - Days
          - Weeks
          description: The type of time period that the timeValue field represents.
        timeValue:
          type: integer
          minimum: 1
          maximum: 24
          description: The period of the time window to gather statistics for. The valid value depends
            on the setting of the timeDimension field. Hours - 1/3/6/12/24 Days - 3 Weeks - 1/2
      required:
      - timeDimension
      - timeValue
    ResourceNotFoundException:
      type: object
      description: You asked to describe a resource that doesn't exist. Check the resource that you are
        requesting and try again.
      properties:
        message:
          type: string
    ResponseSpecification:
      type: object
      description: Specifies a list of message groups that Amazon Lex uses to respond the user input.
      properties:
        messageGroups:
          type: array
          items:
            $ref: '#/components/schemas/MessageGroup'
        allowInterrupt:
          type: boolean
          description: Indicates whether the user can interrupt a speech response from Amazon Lex.
      required:
      - messageGroups
    RuntimeHintDetails:
      type: object
      description: Provides an array of phrases that should be given preference when resolving values
        for a slot.
      properties:
        runtimeHintValues:
          type: array
          items:
            $ref: '#/components/schemas/RuntimeHintValue'
        subSlotHints:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/RuntimeHintDetails'
    RuntimeHintValue:
      type: object
      description: Provides the phrase that Amazon Lex should look for in the user's input to the bot.
      properties:
        phrase:
          type: string
          minLength: 1
          maxLength: 140
          description: The phrase that Amazon Lex should look for in the user's input to the bot.
      required:
      - phrase
    RuntimeHints:
      type: object
      description: You can provide Amazon Lex with hints to the phrases that a customer is likely to use
        for a slot. When a slot with hints is resolved, the phrases in the runtime hints are preferred
        in the resolution. You can provide hints for a maximum of 100 intents. You can provide a maximum
        of 100 slots. Before you can use runtime hints with an existing bot, you must first rebuild the
        bot. For more information, see Using runtime hints to improve recognition of slot values.
      properties:
        slotHints:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              $ref: '#/components/schemas/RuntimeHintDetails'
    RuntimeSettings:
      type: object
      description: Contains specifications about the Amazon Lex runtime generative AI capabilities from
        Amazon Bedrock that you can turn on for your bot.
      properties:
        slotResolutionImprovement:
          $ref: '#/components/schemas/SlotResolutionImprovementSpecification'
        nluImprovement:
          $ref: '#/components/schemas/NluImprovementSpecification'
    S3BucketLogDestination:
      type: object
      description: Specifies an Amazon S3 bucket for logging audio conversations
      properties:
        kmsKeyArn:
          type: string
          minLength: 20
          maxLength: 2048
          pattern: ^arn:[\w\-]+:kms:[\w\-]+:[\d]{12}:(?:key\/[\w\-]+|alias\/[a-zA-Z0-9:\/_\-]{1,256})$
          description: The Amazon Resource Name (ARN) of an Amazon Web Services Key Management Service
            (KMS) key for encrypting audio log files stored in an S3 bucket.
        s3BucketArn:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: ^arn:[\w\-]+:s3:::[a-z0-9][\.\-a-z0-9]{1,61}[a-z0-9]$
          description: The Amazon Resource Name (ARN) of an Amazon S3 bucket where audio log files are
            stored.
        logPrefix:
          type: string
          minLength: 0
          maxLength: 1024
          description: The S3 prefix to assign to audio log files.
      required:
      - s3BucketArn
      - logPrefix
    S3BucketTranscriptSource:
      type: object
      description: The object representing the Amazon S3 bucket containing the transcript, as well as
        the associated metadata.
      properties:
        s3BucketName:
          type: string
          minLength: 3
          maxLength: 63
          pattern: ^[a-z0-9][\.\-a-z0-9]{1,61}[a-z0-9]$
          description: The name of the bucket containing the transcript and the associated metadata.
        pathFormat:
          $ref: '#/components/schemas/PathFormat'
        transcriptFormat:
          type: string
          enum:
          - Lex
          description: The format of the transcript content. Currently, Genie only supports the Amazon
            Lex transcript format.
        transcriptFilter:
          $ref: '#/components/schemas/TranscriptFilter'
        kmsKeyArn:
          type: string
          minLength: 20
          maxLength: 2048
          pattern: ^arn:[\w\-]+:kms:[\w\-]+:[\d]{12}:(?:key\/[\w\-]+|alias\/[a-zA-Z0-9:\/_\-]{1,256})$
          description: The ARN of the KMS key that customer use to encrypt their Amazon S3 bucket. Only
            use this field if your bucket is encrypted using a customer managed KMS key.
      required:
      - s3BucketName
      - transcriptFormat
    SSMLMessage:
      type: object
      description: Defines a Speech Synthesis Markup Language (SSML) prompt.
      properties:
        value:
          type: string
          minLength: 1
          maxLength: 1000
          description: The SSML text that defines the prompt.
      required:
      - value
    SampleUtterance:
      type: object
      description: A sample utterance that invokes an intent or respond to a slot elicitation prompt.
      properties:
        utterance:
          type: string
          description: The sample utterance that Amazon Lex uses to build its machine-learning model to
            recognize intents.
      required:
      - utterance
    SampleUtteranceGenerationSpecification:
      type: object
      description: Contains specifications for the sample utterance generation feature.
      properties:
        enabled:
          type: boolean
          description: Specifies whether to enable sample utterance generation or not.
        bedrockModelSpecification:
          $ref: '#/components/schemas/BedrockModelSpecification'
      required:
      - enabled
    SampleValue:
      type: object
      description: Defines one of the values for a slot type.
      properties:
        value:
          type: string
          minLength: 1
          maxLength: 140
          description: The value that can be used for a slot type.
      required:
      - value
    SearchAssociatedTranscriptsResponse:
      type: object
      properties:
        botId:
          type: string
          minLength: 10
          maxLength: 10
          pattern: ^[0-9a-zA-Z]+$
          description: The unique identifier of the bot associated with the transcripts that you are searching.
        botVersion:
          type: string
          minLength: 1
          maxLength: 5
          pattern: ^(DRAFT|[0-9]+)$
          description: The version of the bot containing the transcripts that you are searching.
        localeId:
          type: string
          description: The identifier of the language and locale of the transcripts to search. The string
            must match one of the supported locales. For more information, see Supported languages
        botRecommendationId:
          type: string
          minLength: 10
          maxLength: 10
          pattern: ^[0-9a-zA-Z]+$
          description: The unique identifier of the bot recommendation associated with the transcripts
            to search.
        nextIndex:
          type: integer
          minimum: 0
          maximum: 10000000
          description: A index that indicates whether there are more results to return in a response to
            the SearchAssociatedTranscripts operation. If the nextIndex field is present, you send the
            contents as the nextIndex parameter of a SearchAssociatedTranscriptsRequest operation to get
            the next page of results.
        associatedTranscripts:
          type: array
          items:
            $ref: '#/components/schemas/AssociatedTranscript'
        totalResults:
          type: integer
          minimum: 1
          maximum: 1000
          description: The total number of transcripts returned by the search.
    SentimentAnalysisSettings:
      type: object
      description: Determines whether Amazon Lex will use Amazon Comprehend to detect the sentiment of
        user utterances.
      properties:
        detectSentiment:
          type: boolean
          description: Sets whether Amazon Lex uses Amazon Comprehend to detect the sentiment of user
            utterances.
      required:
      - detectSentiment
    ServiceQuotaExceededException:
      type: object
      description: You have reached a quota for your bot.
      properties:
        message:
          type: string
    SessionDataSortBy:
      type: object
      description: An object specifying the measure and method by which to sort the session analytics
        data.
      properties:
        name:
          type: string
          enum:
          - ConversationStartTime
          - NumberOfTurns
          - Duration
          description: The measure by which to sort the session analytics data. conversationStartTime
            – The date and time when the conversation began. A conversation is defined as a unique combination
            of a sessionId and an originatingRequestId. numberOfTurns – The number of turns that the session
            took. conversationDurationSeconds – The duration of the conversation in seconds.
        order:
          type: string
          enum:
          - Ascending
          - Descending
          description: Specifies whether to sort the results in ascending or descending order.
      required:
      - name
      - order
    SessionSpecification:
      type: object
      description: An object containing information about a specific session.
      properties:
        botAliasId:
          type: string
          minLength: 10
          maxLength: 10
          pattern: ^(\bTSTALIASID\b|[0-9a-zA-Z]+)$
          description: The identifier of the alias of the bot that the session was held with.
        botVersion:
          type: string
          minLength: 1
          maxLength: 5
          pattern: ^[0-9]+$
          description: The version of the bot that the session was held with.
        localeId:
          type: string
          description: The locale of the bot that the session was held with.
        channel:
          type: string
          minLength: 1
          maxLength: 50
          description: The channel that is integrated with the bot that the session was held with.
        sessionId:
          type: string
          pattern: ^[0-9a-zA-Z._:-]$
          description: The identifier of the session.
        conversationStartTime:
          type: string
          format: date-time
          description: The date and time when the conversation began. A conversation is defined as a unique
            combination of a sessionId and an originatingRequestId.
        conversationEndTime:
          type: string
          format: date-time
          description: The date and time when the conversation ended. A conversation is defined as a unique
            combination of a sessionId and an originatingRequestId.
        conversationDurationSeconds:
          type: integer
          format: int64
          description: The duration of the conversation in seconds. A conversation is defined as a unique
            combination of a sessionId and an originatingRequestId.
        conversationEndState:
          type: string
          enum:
          - Success
          - Failure
          - Dropped
          description: The final state of the conversation. A conversation is defined as a unique combination
            of a sessionId and an originatingRequestId.
        mode:
          type: string
          enum:
          - Speech
          - Text
          - DTMF
          - MultiMode
          description: 'The mode of the session. The possible values are as follows: Speech – The session
            was spoken. Text – The session was written. DTMF – The session used a touch-tone keypad (Dual
            Tone Multi-Frequency). MultiMode – The session used multiple modes.'
        numberOfTurns:
          type: integer
          format: int64
          description: The number of turns that the session took.
        invokedIntentSamples:
          type: array
          items:
            $ref: '#/components/schemas/InvokedIntentSample'
        originatingRequestId:
          type: string
          description: The identifier of the first request in a session.
    SlotCaptureSetting:
      type: object
